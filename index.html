async function fbSave(key,value){
  try{ if(!window._db)return; await window._setDoc(window._doc(window._db,"nemo",key),{value:JSON.stringify(value)}); }catch(e){console.warn(e);}
}
function fbListen(key,cb){
  if(!window._db)return()=>{};
  return window._onSnapshot(window._doc(window._db,"nemo",key),snap=>{
    if(snap.exists()){try{cb(JSON.parse(snap.data().value));}catch(e){}}
  });
}

function LineChart({data,color="#378ADD"}){
  if(!data||data.length<2)return <Empty msg="Servono almeno 2 dati"/>;
  const W=500,H=120,PAD=32;
  const vals=data.map(d=>d.val);
  const max=Math.max(...vals),min=Math.min(...vals),range=max-min||1;
  const pts=data.map((d,i)=>({x:PAD+(i/(data.length-1))*(W-PAD*2),y:PAD+((max-d.val)/range)*(H-PAD*2),label:d.label}));
  const path=pts.map((p,i)=>`${i===0?"M":"L"} ${p.x} ${p.y}`).join(" ");
  const area=`${path} L ${pts[pts.length-1].x} ${H-8} L ${pts[0].x} ${H-8} Z`;
  return(
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}}>
      {[0,1,2].map(i=>{const y=PAD+(i/2)*(H-PAD*1.5);return(<g key={i}><line x1={PAD} y1={y} x2={W-8} y2={y} stroke={B.border} strokeWidth="1"/><text x={PAD-4} y={y+4} fontSize="9" fill={B.dark} textAnchor="end">{(max-(i/2)*range).toFixed(1)}</text></g>);})}
      <path d={area} fill={color} fillOpacity="0.13"/>
      <path d={path} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
      {pts.map((p,i)=><g key={i}><circle cx={p.x} cy={p.y} r="5" fill="#fff" stroke={color} strokeWidth="2"/><text x={p.x} y={H} fontSize="9" fill={B.dark} textAnchor="middle">{p.label}</text></g>)}
    </svg>
  );
}
function BarChart({data,color="#378ADD"}){
  if(!data||data.length===0)return <Empty msg="Nessun dato"/>;
  const W=500,H=110,PAD=28;
  const max=Math.max(...data.map(d=>d.val),1);
  const bw=Math.min(38,(W-PAD*2)/data.length-6);
  return(
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}}>
      {data.map((d,i)=>{const bh=((d.val/max)*(H-PAD-10));const x=PAD+i*((W-PAD*2)/data.length)+((W-PAD*2)/data.length-bw)/2;const y=H-PAD-bh;return(<g key={i}><rect x={x} y={y} width={bw} height={bh} rx="5" fill={color} fillOpacity="0.75"/><text x={x+bw/2} y={y-3} fontSize="9" fill={B.dark} textAnchor="middle">{d.val}</text><text x={x+bw/2} y={H-2} fontSize="9" fill={B.dark} textAnchor="middle">{d.label}</text></g>);})}
    </svg>
  );
}
function Trend({data}){
  if(!data||data.length<2)return null;
  const diff=data[data.length-1].val-data[data.length-2].val;
  if(diff===0)return <Tag color="secondary">= stabile</Tag>;
  return <Tag color={diff>0?"success":"danger"}>{diff>0?"↑ miglioramento":"↓ peggioramento"}</Tag>;
}

function WalkMap({places,onAddPlace}){
  const mapRef=useRef(null),leafletRef=useRef(null),markersRef=useRef([]);
  const [mapReady,setMapReady]=useState(false),[clicking,setClicking]=useState(false);
  useEffect(()=>{
    if(mapRef.current&&!leafletRef.current){
      const link=document.createElement("link");link.rel="stylesheet";link.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";document.head.appendChild(link);
      const s=document.createElement("script");s.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
      s.onload=()=>{setTimeout(()=>{
        const L=window.L,map=L.map(mapRef.current).setView([41.9,12.5],5);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(map);
        leafletRef.current=map;setMapReady(true);
        if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],14));
      },300);};
      document.head.appendChild(s);
    }
  },[]);
  useEffect(()=>{
    if(!mapReady||!leafletRef.current)return;
    const L=window.L,map=leafletRef.current;
    markersRef.current.forEach(m=>m.remove());markersRef.current=[];
    places.forEach(p=>{
      const icon=L.divIcon({className:"",html:`<div style="background:${B.mid};color:white;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:15px;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.2)">${p.emoji||"📍"}</div>`,iconSize:[30,30],iconAnchor:[15,15]});
      markersRef.current.push(L.marker([p.lat,p.lng],{icon}).addTo(map).bindPopup(`<b>${p.name}</b>${p.notes?"<br>"+p.notes:""}`));
    });
  },[places,mapReady]);
  useEffect(()=>{
    if(!mapReady||!leafletRef.current)return;
    const map=leafletRef.current;
    const h=e=>{if(clicking)onAddPlace&&onAddPlace(e.latlng.lat,e.latlng.lng);};
    map.on("click",h);return()=>map.off("click",h);
  },[mapReady,clicking,onAddPlace]);
  return(
    <div>
      <div ref={mapRef} style={{width:"100%",height:240,borderRadius:14,overflow:"hidden",border:`1.5px solid ${B.border}`}}/>
      <div style={{marginTop:8}}><Btn small onClick={()=>setClicking(c=>!c)}>{clicking?"✓ Clicca sulla mappa...":"📍 Aggiungi luogo"}</Btn></div>
    </div>
  );
}

function App(){
  const [loggedIn,setLoggedIn]=useState(()=>sessionStorage.getItem("nemo_auth")==="1");
  const handleLogin=()=>{sessionStorage.setItem("nemo_auth","1");setLoggedIn(true);};
  if(!loggedIn)return <Login onLogin={handleLogin}/>;

  const [section,setSection]=useState("home");
  const [menuOpen,setMenuOpen]=useState(false);
  const [dog,setDog]=useState({name:"",breed:"",dob:"",chip:""});
  const [dogPhoto,setDogPhoto]=useState(null);
  const [meds,setMeds]=useState([]);
  const [alones,setAlones]=useState([]);
  const [weights,setWeights]=useState([]);
  const [walks,setWalks]=useState([]);
  const [photos,setPhotos]=useState([]);
  const [vets,setVets]=useState([]);
  const [symptoms,setSymptoms]=useState([]);
  const [friends,setFriends]=useState([]);
  const [places,setPlaces]=useState([]);
  const [ready,setReady]=useState(false);
  const [reminder,setReminder]=useState(null);
  const [form,setForm]=useState({});
  const [mapPending,setMapPending]=useState(null);
  const photoInputRef=useRef(null);
  const timerRef=useRef(null);
  const saveEnabled=useRef(false);

  useEffect(()=>{
    const init=()=>{
      const setters={dog:setDog,dogPhoto:setDogPhoto,meds:setMeds,alones:setAlones,weights:setWeights,walks:setWalks,photos:setPhotos,vets:setVets,symptoms:setSymptoms,friends:setFriends,places:setPlaces};
      let loaded={};
      const unsubs=KEYS.map(k=>fbListen(k,v=>{
        setters[k](v);
        loaded[k]=true;
        if(KEYS.every(key=>loaded[key])){
          setTimeout(()=>{saveEnabled.current=true;setReady(true);},300);
        }
      }));
      const timeout=setTimeout(()=>{saveEnabled.current=true;setReady(true);},4000);
      return()=>{unsubs.forEach(u=>u());clearTimeout(timeout);};
    };
    if(window._fbReady){const cleanup=init();return cleanup;}
    let cleanup=null;
    const h=()=>{cleanup=init();};
    window.addEventListener("firebase-ready",h);
    return()=>{window.removeEventListener("firebase-ready",h);cleanup&&cleanup();};
  },[]);

  useEffect(()=>{if(saveEnabled.current)fbSave("dog",dog);},[dog]);
  useEffect(()=>{if(saveEnabled.current)fbSave("dogPhoto",dogPhoto);},[dogPhoto]);
  useEffect(()=>{if(saveEnabled.current)fbSave("meds",meds);},[meds]);
  useEffect(()=>{if(saveEnabled.current)fbSave("alones",alones);},[alones]);
  useEffect(()=>{if(saveEnabled.current)fbSave("weights",weights);},[weights]);
  useEffect(()=>{if(saveEnabled.current)fbSave("walks",walks);},[walks]);
  useEffect(()=>{if(saveEnabled.current)fbSave("photos",photos);},[photos]);
  useEffect(()=>{if(saveEnabled.current)fbSave("vets",vets);},[vets]);
  useEffect(()=>{if(saveEnabled.current)fbSave("symptoms",symptoms);},[symptoms]);
  useEffect(()=>{if(saveEnabled.current)fbSave("friends",friends);},[friends]);
  useEffect(()=>{if(saveEnabled.current)fbSave("places",places);},[places]);

  useEffect(()=>{
    const check=()=>{
      const now=new Date().toTimeString().slice(0,5),td=today();
      meds.forEach(m=>{
        if(!m.active||!m.reminderTime)return;
        if(m.reminderTime===now&&(!m.lastReminderDate||m.lastReminderDate!==td)){
          setReminder(m);
          setMeds(p=>p.map(x=>x.id===m.id?{...x,lastReminderDate:td}:x));
        }
      });
    };
    timerRef.current=setInterval(check,30000);check();
    return()=>clearInterval(timerRef.current);
  },[meds]);

  const f=(k,v)=>setForm(p=>({...p,[k]:v}));
  const addItem=(setter,item)=>{setter(p=>[{...item,id:Date.now()},...p]);setForm({});};
  const delItem=(setter,id)=>setter(p=>p.filter(x=>x.id!==id));
  const handleDogPhoto=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>setDogPhoto(ev.target.result);r.readAsDataURL(file);};
  const handlePhotoUpload=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>f("photoData",ev.target.result);r.readAsDataURL(file);};
  const goTo=id=>{setSection(id);setMenuOpen(false);setForm({});setMapPending(null);};

  const weightChart=[...weights].reverse().slice(-12).map(w=>({val:+w.kg,label:fmt(w.date).slice(0,5)}));
  const aloneChart=[...alones].reverse().slice(-12).map(a=>({val:+a.score,label:fmt(a.date).slice(0,5)}));
  const walksPerMonth=()=>{const c={};walks.forEach(w=>{const m=w.date?.slice(0,7)||"";c[m]=(c[m]||0)+1;});return Object.entries(c).sort().slice(-6).map(([m,v])=>({val:v,label:m.slice(5)}));};
  const sympByType=()=>{const c={};symptoms.forEach(s=>{c[s.symptom]=(c[s.symptom]||0)+1;});return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>({val:v,label:k.slice(0,8)}));};
  const NAV_SECTIONS=SECTIONS.filter(s=>s.id!=="settings");

  // Random memory photo
  const randomPhoto=useMemo(()=>{
    if(!photos||photos.length===0)return null;
    return photos[Math.floor(Math.random()*photos.length)];
  },[photos.length]);

  if(!ready)return <LoadingScreen/>;

  return(
    <div style={{maxWidth:680,margin:"0 auto",padding:"0 0 2rem",minHeight:"100vh"}}>
      <PawBg/>
      <div style={{position:"relative",zIndex:1}}>

        {/* HEADER */}
        <div style={{background:GRAD,borderRadius:"0 0 28px 28px",padding:"16px 18px 18px",marginBottom:20,display:"flex",alignItems:"center",justifyContent:"space-between",boxShadow:"0 6px 24px rgba(24,95,165,0.28)"}}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <div onClick={()=>photoInputRef.current?.click()} style={{width:52,height:52,borderRadius:"50%",border:"3px solid rgba(255,255,255,0.85)",overflow:"hidden",cursor:"pointer",background:"rgba(255,255,255,0.2)",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 2px 8px rgba(0,0,0,0.15)",flexShrink:0}}>
              {dogPhoto?<img src={dogPhoto} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<span style={{fontSize:26}}>🐶</span>}
            </div>

                      <span>{moodEmoji[w.mood]}</span>
                    </div>
                    <p style={{fontSize:13,color:"#64748b",margin:0}}>{w.mins?`${w.mins} min`:""}{w.km?` · ${w.km} km`:""}</p>
                  </div>
                  <Btn small danger onClick={()=>delItem(setWalks,w.id)}>✕</Btn>
                </div>
              </Card>
            ))}
          </div>
        )}

        {/* DIARIO FOTO */}
        {section==="photos"&&(
          <div>
            <Card>
              <p style={{fontWeight:700,marginBottom:12,color:B.text}}>Aggiungi foto</p>
              <Input label="Data" type="date" value={form.date||today()} onChange={e=>f("date",e.target.value)}/>
              <Input label="Luogo / occasione" value={form.place||""} onChange={e=>f("place",e.target.value)} placeholder="es. Parco della Villa"/>
              <div style={{marginBottom:10}}>
                <label style={{fontSize:13,color:B.dark,display:"block",marginBottom:4,fontWeight:600}}>Foto</label>
                <input type="file" accept="image/*" onChange={handlePhotoUpload} style={{fontSize:13}}/>
              </div>
              {form.photoData&&<img src={form.photoData} style={{width:"100%",borderRadius:12,marginBottom:10,maxHeight:200,objectFit:"cover"}}/>}
              <Input label="Didascalia" value={form.caption||""} onChange={e=>f("caption",e.target.value)} placeholder="es. Prima passeggiata al mare!"/>
              <Btn accent onClick={()=>{if(!form.photoData)return;addItem(setPhotos,form);}}>+ Aggiungi</Btn>
            </Card>
            {photos.length===0&&<Empty msg="Nessuna foto nel diario"/>}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              {photos.map(p=>(
                <div key={p.id} style={{background:"white",border:`1px solid ${B.border}`,borderRadius:16,overflow:"hidden",boxShadow:"0 3px 10px rgba(55,138,221,0.1)"}}>
                  <img src={p.photoData} style={{width:"100%",height:145,objectFit:"cover",display:"block"}}/>
                  <div style={{padding:"9px 11px"}}>
                    <p style={{fontSize:12,color:B.dark,margin:"0 0 2px",fontWeight:600}}>{fmt(p.date)}{p.place?` · ${p.place}`:""}</p>
                    {p.caption&&<p style={{fontSize:12,color:"#64748b",margin:0}}>{p.caption}</p>}
                    <button onClick={()=>delItem(setPhotos,p.id)} style={{fontSize:11,color:"#b91c1c",background:"none",border:"none",cursor:"pointer",padding:0,marginTop:5}}>rimuovi</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* VETERINARIO */}
        {section==="vet"&&(
          <div>
            {vets.filter(v=>v.next&&v.next>=today()).length>0&&(
              <Card style={{background:"linear-gradient(135deg,#f0fdf4,#dcfce7)",border:"1px solid #86efac"}}>
                <p style={{fontWeight:700,margin:"0 0 10px",color:"#166534"}}>📅 Prossimi appuntamenti</p>
                {vets.filter(v=>v.next&&v.next>=today()).sort((a,b)=>a.next.localeCompare(b.next)).map(v=>(
                  <div key={v.id} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderTop:"1px solid #bbf7d0",fontSize:13,color:"#166534"}}>
                    <span style={{fontWeight:500}}>{v.type}{v.vet?` — ${v.vet}`:""}</span><span style={{fontWeight:700}}>{fmt(v.next)}</span>
                  </div>
                ))}
              </Card>
            )}
            <Card>
              <p style={{fontWeight:700,marginBottom:12,color:B.text}}>Aggiungi visita / vaccino</p>
              <Input label="Data" type="date" value={form.date||today()} onChange={e=>f("date",e.target.value)}/>
              <Input label="Tipo" value={form.type||""} onChange={e=>f("type",e.target.value)} placeholder="es. visita, vaccino"/>
              <Input label="Veterinario" value={form.vet||""} onChange={e=>f("vet",e.target.value)}/>
              <Input label="Diagnosi / risultato" value={form.result||""} onChange={e=>f("result",e.target.value)}/>
              <Input label="Prossimo appuntamento" type="date" value={form.next||""} onChange={e=>f("next",e.target.value)}/>
              <Input label="Note" value={form.notes||""} onChange={e=>f("notes",e.target.value)}/>
              <Btn accent onClick={()=>{if(!form.type)return;addItem(setVets,form);}}>+ Aggiungi</Btn>
            </Card>
            {vets.length===0&&<Empty msg="Nessuna visita registrata"/>}
            {vets.map(v=>(
              <Card key={v.id}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div><p style={{fontWeight:700,margin:"0 0 3px",color:B.text}}>{v.type}</p><p style={{fontSize:13,color:"#64748b",margin:"0 0 5px"}}>{fmt(v.date)}{v.vet?` — ${v.vet}`:""}</p>{v.next&&<Tag color={v.next>=today()?"success":"secondary"}>Prossimo: {fmt(v.next)}</Tag>}{v.notes&&<p style={{fontSize:12,color:"#94a3b8",marginTop:6}}>{v.notes}</p>}</div>
                  <Btn small danger onClick={()=>delItem(setVets,v.id)}>✕</Btn>
                </div>
              </Card>
            ))}
          </div>
        )}

        {/* SINTOMI */}
        {section==="symptoms"&&(
          <div>
            <Card>
              <p style={{fontWeight:700,marginBottom:12,color:B.text}}>Registra sintomo</p>
              <Input label="Data" type="date" value={form.date||today()} onChange={e=>f("date",e.target.value)}/>
              <Input label="Sintomo" value={form.symptom||""} onChange={e=>f("symptom",e.target.value)} placeholder="es. vomito, zoppia..."/>
              <div style={{marginBottom:10}}>
                <label style={{fontSize:13,color:B.dark,display:"block",marginBottom:4,fontWeight:600}}>Gravità</label>
                <select value={form.severity||"lieve"} onChange={e=>f("severity",e.target.value)} style={{width:"100%",borderRadius:10,border:`1.5px solid ${B.border}`,padding:"9px 12px",background:"#f8fbff",fontSize:14}}>
                  <option value="lieve">Lieve — da tenere d'occhio</option>
                  <option value="moderata">Moderata — meglio sentire il vet</option>
                  <option value="grave">Grave — andare subito dal vet</option>
                </select>
              </div>
              <Input label="Note" value={form.notes||""} onChange={e=>f("notes",e.target.value)}/>
              <Btn accent onClick={()=>{if(!form.symptom)return;addItem(setSymptoms,{...form,severity:form.severity||"lieve"});}}>+ Aggiungi</Btn>
            </Card>
            {symptoms.length===0&&<Empty msg="Nessun sintomo registrato"/>}
            {symptoms.map(s=>(
              <Card key={s.id}><div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}><div><p style={{fontWeight:700,margin:"0 0 4px",color:B.text}}>{s.symptom}</p><p style={{fontSize:13,color:"#64748b",margin:"0 0 5px"}}>{fmt(s.date)}</p><Tag color={s.severity==="grave"?"danger":s.severity==="moderata"?"warning":"success"}>{s.severity==="grave"?"Grave":s.severity==="moderata"?"Moderata":"Lieve"}</Tag></div><Btn small danger onClick={()=>delItem(setSymptoms,s.id)}>✕</Btn></div></Card>
            ))}
          </div>
        )}

        {/* AMICI */}
        {section==="friends"&&(
          <div>
            <Card>
              <p style={{fontWeight:700,marginBottom:12,color:B.text}}>Aggiungi amico</p>
              <Input label="Nome del cane" value={form.name||""} onChange={e=>f("name",e.target.value)} placeholder="es. Fido"/>
              <Input label="Razza" value={form.breed||""} onChange={e=>f("breed",e.target.value)}/>
              <Input label="Proprietario" value={form.owner||""} onChange={e=>f("owner",e.target.value)}/>
              <div style={{marginBottom:14}}>
                <label style={{fontSize:13,color:B.dark,display:"block",marginBottom:9,fontWeight:600}}>Reazione di Nemo</label>
                <div style={{display:"flex",gap:9}}>
                  {REACTION_OPTIONS.map(r=>(
                    <label key={r.val} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:5,cursor:"pointer",padding:"11px 4px",borderRadius:12,border:`2px solid ${form.reaction===r.val?B.mid:B.border}`,background:form.reaction===r.val?B.bg:"white",transition:"all 0.15s"}}>
                      <input type="radio" name="reaction" value={r.val} checked={form.reaction===r.val} onChange={()=>f("reaction",r.val)} style={{display:"none"}}/>
                      <span style={{fontSize:26}}>{r.label.split(" ")[0]}</span>
                      <span style={{fontSize:12,color:B.dark,fontWeight:600}}>{r.label.split(" ")[1]}</span>
                    </label>
                  ))}
                </div>
              </div>
              <div style={{marginBottom:10}}>
                <label style={{fontSize:13,color:B.dark,display:"block",marginBottom:4,fontWeight:600}}>Note</label>
                <textarea value={form.notes||""} onChange={e=>f("notes",e.target.value)} placeholder="es. I primi minuti abbaia poi si calma..." style={{width:"100%",minHeight:70,padding:"9px 12px",borderRadius:10,border:`1.5px solid ${B.border}`,background:"#f8fbff",fontSize:14,resize:"vertical"}}/>
              </div>
              <Input label="Data primo incontro" type="date" value={form.metDate||today()} onChange={e=>f("metDate",e.target.value)}/>
              <Btn accent onClick={()=>{if(!form.name)return;addItem(setFriends,{...form,reaction:form.reaction||"neutro"});}}>+ Aggiungi</Btn>
            </Card>
            {friends.length>0&&(
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:14}}>
                {REACTION_OPTIONS.map(r=>(
                  <div key={r.val} style={{background:"rgba(255,255,255,0.9)",borderRadius:14,padding:"0.8rem",textAlign:"center",border:`1px solid ${B.border}`}}>
                    <p style={{fontSize:24,margin:"0 0 3px"}}>{r.label.split(" ")[0]}</p>
                    <p style={{fontSize:20,fontWeight:800,margin:"0 0 2px",color:B.text}}>{friends.filter(fr=>fr.reaction===r.val).length}</p>
                    <p style={{fontSize:11,color:B.dark,margin:0,fontWeight:600}}>{r.label.split(" ")[1]}</p>
                  </div>
                ))}
              </div>
            )}
            {friends.length===0&&<Empty msg="Nessun amico registrato"/>}
            {friends.map(fr=>{
              const rx=REACTION_OPTIONS.find(r=>r.val===fr.reaction)||REACTION_OPTIONS[1];
              return(
                <Card key={fr.id}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",alignItems:"center",gap:11,marginBottom:7}}>
                        <div style={{width:44,height:44,borderRadius:"50%",background:B.bg,border:`2px solid ${B.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:23}}>🐕</div>
                        <div><p style={{fontWeight:700,margin:0,color:B.text}}>{fr.name}{fr.breed?` · ${fr.breed}`:""}</p>{fr.owner&&<p style={{fontSize:13,color:"#64748b",margin:0}}>di {fr.owner}</p>}</div>
                      </div>
                      <Tag color={rx.color}>{rx.label}</Tag>
                      {fr.notes&&<div style={{background:B.bg,borderRadius:10,padding:"9px 11px",marginTop:8}}><p style={{fontSize:13,color:B.dark,margin:0,fontStyle:"italic"}}>{fr.notes}</p></div>}
                    </div>
                    <Btn small danger onClick={()=>delItem(setFriends,fr.id)}>✕</Btn>
                  </div>
                  <div style={{marginTop:9}}>{REACTION_OPTIONS.map(r=><Btn key={r.val} small onClick={()=>setFriends(p=>p.map(x=>x.id===fr.id?{...x,reaction:r.val}:x))}>{r.label}</Btn>)}</div>
                </Card>
              );
            })}
          </div>
        )}

        {/* GRAFICI */}
        {section==="charts"&&(
          <div>
            <Card>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <p style={{fontWeight:700,margin:0,color:B.text}}>Peso</p><Trend data={weightChart}/>
              </div>
              {weights.length>=2?<LineChart data={weightChart} color={B.mid}/>:<Empty msg="Aggiungi almeno 2 pesate"/>}
              {weights.length>0&&(
                <div style={{display:"flex",gap:8,marginTop:12}}>
                  {[{label:"Attuale",val:weights[0].kg+" kg"},{label:"Minimo",val:Math.min(...weights.map(w=>+w.kg))+" kg"},{label:"Massimo",val:Math.max(...weights.map(w=>+w.kg))+" kg"}].map(c=>(
                    <div key={c.label} style={{flex:1,background:B.bg,borderRadius:10,padding:"9px",textAlign:"center"}}>
                      <p style={{fontSize:11,color:B.dark,margin:0,fontWeight:600}}>{c.label}</p>
                      <p style={{fontSize:16,fontWeight:800,margin:0,color:B.text}}>{c.val}</p>
                    </div>
                  ))}
                </div>
              )}
            </Card>
            <Card>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <p style={{fontWeight:700,margin:0,color:B.text}}>Solo a casa</p><Trend data={aloneChart}/>
              </div>
              {alones.length>=2?<LineChart data={aloneChart} color="#1D9E75"/>:<Empty msg="Aggiungi almeno 2 sessioni"/>}
            </Card>
            <Card>
              <p style={{fontWeight:700,margin:"0 0 10px",color:B.text}}>Passeggiate per mese</p>
              {walks.length>=2?<BarChart data={walksPerMonth()} color={B.mid}/>:<Empty msg="Aggiungi almeno 2 giri"/>}
            </Card>
            <Card>
              <p style={{fontWeight:700,margin:"0 0 10px",color:B.text}}>Sintomi più frequenti</p>
              {symptoms.length>=2?<BarChart data={sympByType()} color="#E24B4A"/>:<Empty msg="Aggiungi almeno 2 sintomi"/>}
              {symptoms.length>0&&(
                <div style={{display:"flex",gap:8,marginTop:12}}>
                  {[{label:"Gravi",val:symptoms.filter(s=>s.severity==="grave").length,bg:"#fee2e2",tc:"#b91c1c"},{label:"Moderati",val:symptoms.filter(s=>s.severity==="moderata").length,bg:"#fef9c3",tc:"#854d0e"},{label:"Lievi",val:symptoms.filter(s=>s.severity==="lieve").length,bg:"#dcfce7",tc:"#166534"}].map(c=>(
                    <div key={c.label} style={{flex:1,background:c.bg,borderRadius:10,padding:"9px",textAlign:"center"}}>
                      <p style={{fontSize:11,color:c.tc,margin:0,fontWeight:600}}>{c.label}</p>
                      <p style={{fontSize:16,fontWeight:800,margin:0,color:c.tc}}>{c.val}</p>
                    </div>
                  ))}
                </div>
              )}
            </Card>
          </div>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
