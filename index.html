function compressImage(file,cb){const img=new Image(),r=new FileReader();r.onload=ev=>{img.onload=()=>{const c=document.createElement("canvas");const MAX=600;let w=img.width,h=img.height;if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);cb(c.toDataURL("image/jpeg",0.7));};img.src=ev.target.result;};r.readAsDataURL(file);}

// Service Worker for push notifications
function registerSW(){
  if(!('serviceWorker' in navigator)||!('Notification' in window))return;
  const sw=`
self.addEventListener('message',e=>{
  if(e.data&&e.data.type==='SCHEDULE_NOTIF'){
    const {title,body,delay}=e.data;
    setTimeout(()=>{
      self.registration.showNotification(title,{body,icon:'/icon.png',badge:'/icon.png',vibrate:[200,100,200]});
    },delay);
  }
});
self.addEventListener('notificationclick',e=>{e.notification.close();});
`;
  const blob=new Blob([sw],{type:'application/javascript'});
  const url=URL.createObjectURL(blob);
  navigator.serviceWorker.register(url).then(reg=>{window._swReg=reg;}).catch(()=>{});
}
function requestNotifPermission(){
  if(!('Notification' in window))return;
  if(Notification.permission==='default') Notification.requestPermission();
}
function scheduleNotification(title,body,delayMs){
  if(Notification.permission==='granted'&&window._swReg){
    window._swReg.active?.postMessage({type:'SCHEDULE_NOTIF',title,body,delay:delayMs});
  }
}
function scheduleDailyReminders(meds){
  if(Notification.permission!=='granted')return;
  const now=new Date();
  meds.filter(m=>m.active&&m.reminderTime).forEach(m=>{
    const [hh,mm]=m.reminderTime.split(':').map(Number);
    const target=new Date(now);
    target.setHours(hh,mm,0,0);
    if(target<=now)target.setDate(target.getDate()+1);
    const delay=target-now;
    scheduleNotification(`💊 Farmaco per Nemo`,`È ora di dare: ${m.name} — ${m.dose}`,delay);
  });
}

function LineChart({data,color="#378ADD"}){
  if(!data||data.length<2)return <Empty msg="Servono almeno 2 dati"/>;
  const W=500,H=120,PAD=32;
  const sorted=[...data].sort((a,b)=>(a.dateKey||"").localeCompare(b.dateKey||""));
  const vals=sorted.map(d=>d.val);
  const max=Math.max(...vals),min=Math.min(...vals),range=max-min||1;
  const pts=sorted.map((d,i)=>({x:PAD+(i/(sorted.length-1))*(W-PAD*2),y:PAD+((max-d.val)/range)*(H-PAD*2),label:d.label}));
  const path=pts.map((p,i)=>`${i===0?"M":"L"} ${p.x} ${p.y}`).join(" ");
  const area=`${path} L ${pts[pts.length-1].x} ${H-8} L ${pts[0].x} ${H-8} Z`;
  return(<svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}}>{[0,1,2].map(i=>{const y=PAD+(i/2)*(H-PAD*1.5);return(<g key={i}><line x1={PAD} y1={y} x2={W-8} y2={y} stroke={B.border} strokeWidth="1"/><text x={PAD-4} y={y+4} fontSize="9" fill={B.dark} textAnchor="end">{(max-(i/2)*range).toFixed(1)}</text></g>);})} <path d={area} fill={color} fillOpacity="0.13"/><path d={path} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>{pts.map((p,i)=><g key={i}><circle cx={p.x} cy={p.y} r="5" fill="#fff" stroke={color} strokeWidth="2"/><text x={p.x} y={H} fontSize="9" fill={B.dark} textAnchor="middle">{p.label}</text></g>)}</svg>);
}
function BarChart({data,color="#378ADD"}){
  if(!data||data.length===0)return <Empty msg="Nessun dato"/>;
  const sorted=[...data].sort((a,b)=>(a.dateKey||"").localeCompare(b.dateKey||""));
  const W=500,H=110,PAD=28;
  const max=Math.max(...sorted.map(d=>d.val),1);
  const bw=Math.min(38,(W-PAD*2)/sorted.length-6);
  return(<svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}}>{sorted.map((d,i)=>{const bh=((d.val/max)*(H-PAD-10));const x=PAD+i*((W-PAD*2)/sorted.length)+((W-PAD*2)/sorted.length-bw)/2;const y=H-PAD-bh;return(<g key={i}><rect x={x} y={y} width={bw} height={bh} rx="5" fill={color} fillOpacity="0.75"/><text x={x+bw/2} y={y-3} fontSize="9" fill={B.dark} textAnchor="middle">{d.val}</text><text x={x+bw/2} y={H-2} fontSize="9" fill={B.dark} textAnchor="middle">{d.label}</text></g>);})} </svg>);
}
function Trend({data}){
  if(!data||data.length<2)return null;
  const sorted=[...data].sort((a,b)=>(a.dateKey||"").localeCompare(b.dateKey||""));
  const diff=sorted[sorted.length-1].val-sorted[sorted.length-2].val;
  if(diff===0)return <Tag color="secondary">= stabile</Tag>;
  return <Tag color={diff>0?"success":"danger"}>{diff>0?"↑ in aumento":"↓ in calo"}</Tag>;
}

function WalkMap({places,onAddPlace}){
  const mapRef=useRef(null),leafletRef=useRef(null),markersRef=useRef([]);
  const [mapReady,setMapReady]=useState(false),[clicking,setClicking]=useState(false);
  useEffect(()=>{if(mapRef.current&&!leafletRef.current){const link=document.createElement("link");link.rel="stylesheet";link.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";document.head.appendChild(link);const s=document.createElement("script");s.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";s.onload=()=>{setTimeout(()=>{const L=window.L,map=L.map(mapRef.current).setView([41.9,12.5],5);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(map);leafletRef.current=map;setMapReady(true);if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],14));},300);};document.head.appendChild(s);}},[]); 
  useEffect(()=>{if(!mapReady||!leafletRef.current)return;const L=window.L,map=leafletRef.current;markersRef.current.forEach(m=>m.remove());markersRef.current=[];places.forEach(p=>{const icon=L.divIcon({className:"",html:`<div style="background:${B.mid};color:white;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:15px;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.2)">${p.emoji||"📍"}</div>`,iconSize:[30,30],iconAnchor:[15,15]});markersRef.current.push(L.marker([p.lat,p.lng],{icon}).addTo(map).bindPopup(`<b>${p.name}</b>${p.notes?"<br>"+p.notes:""}`));});},[places,mapReady]);
  useEffect(()=>{if(!mapReady||!leafletRef.current)return;const map=leafletRef.current;const h=e=>{if(clicking)onAddPlace&&onAddPlace(e.latlng.lat,e.latlng.lng);};map.on("click",h);return()=>map.off("click",h);},[mapReady,clicking,onAddPlace]);
  return(<div><div ref={mapRef} style={{width:"100%",height:240,borderRadius:14,overflow:"hidden",border:`1.5px solid ${B.border}`}}/><div style={{marginTop:8}}><Btn small onClick={()=>setClicking(c=>!c)}>{clicking?"✓ Clicca sulla mappa...":"📍 Aggiungi luogo"}</Btn></div></div>);
}

        </div>
        {fields.map(field=>{
          if(field.type==="select")return(<div key={field.key} style={{marginBottom:10}}><label style={{fontSize:13,color:B.dark,display:"block",marginBottom:4,fontWeight:600}}>{field.label}</label><select value={data[field.key]||""} onChange={e=>fd(field.key,e.target.value)} style={{width:"100%",borderRadius:10,border:`1.5px solid ${B.border}`,padding:"9px 12px",background:"#f8fbff",fontSize:14}}>{field.options.map(o=><option key={o.val||o} value={o.val||o}>{o.label||o}</option>)}</select></div>);
          if(field.type==="textarea")return(<div key={field.key} style={{marginBottom:10}}><label style={{fontSize:13,color:B.dark,display:"block",marginBottom:4,fontWeight:600}}>{field.label}</label><textarea value={data[field.key]||""} onChange={e=>fd(field.key,e.target.value)} style={{width:"100%",minHeight:70,padding:"9px 12px",borderRadius:10,border:`1.5px solid ${B.border}`,background:"#f8fbff",fontSize:14,resize:"vertical"}}/></div>);
          if(field.type==="range")return(<div key={field.key} style={{marginBottom:10}}><label style={{fontSize:13,color:B.dark,display:"block",marginBottom:4,fontWeight:600}}>{field.label}</label><input type="range" min={field.min||1} max={field.max||5} step={1} value={data[field.key]||field.min||1} onChange={e=>fd(field.key,+e.target.value)} style={{width:"100%"}}/><span style={{fontSize:13}}>{moodEmoji[data[field.key]||3]} {moodLabel[data[field.key]||3]}</span></div>);
          if(field.type==="checkboxes")return(<div key={field.key} style={{marginBottom:10}}><label style={{fontSize:13,color:B.dark,display:"block",marginBottom:6,fontWeight:600}}>{field.label}</label>{field.options.map(b=>(<label key={b.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",borderRadius:10,border:`1.5px solid ${(data[field.key]||[]).includes(b.id)?B.mid:B.border}`,background:(data[field.key]||[]).includes(b.id)?B.bg:"white",cursor:"pointer",fontSize:14,marginBottom:6}}><input type="checkbox" checked={(data[field.key]||[]).includes(b.id)} onChange={e=>{const c=data[field.key]||[];fd(field.key,e.target.checked?[...c,b.id]:c.filter(x=>x!==b.id));}}/>{b.label}</label>))}</div>);
          return(<div key={field.key} style={{marginBottom:10}}><label style={{fontSize:13,color:B.dark,display:"block",marginBottom:4,fontWeight:600}}>{field.label}</label><input type={field.type||"text"} value={data[field.key]||""} onChange={e=>fd(field.key,e.target.value)} placeholder={field.placeholder||""} style={{width:"100%",borderRadius:10,border:`1.5px solid ${B.border}`,padding:"9px 12px",fontSize:14,background:"#f8fbff",outline:"none"}}/></div>);
        })}
        <Btn accent onClick={()=>{onSave(data);onClose();}}>Salva modifiche</Btn>
      </div>
    </div>
  );
}

function LoadingScreen(){return(<div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"linear-gradient(160deg,#cce8ff 0%,#f0f8ff 100%)"}}><PawBg/><div style={{position:"relative",zIndex:1,textAlign:"center"}}><div style={{width:80,height:80,borderRadius:"50%",background:GRAD,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px",boxShadow:"0 8px 24px rgba(55,138,221,0.3)"}}><span style={{fontSize:38}}>🐾</span></div><p style={{fontWeight:800,fontSize:22,color:B.text,margin:"0 0 8px"}}>Nemo</p><p style={{fontSize:14,color:B.dark,opacity:0.7}}>Caricamento in corso...</p></div></div>);}

function App(){
  const [section,setSection]=useState("home");
  const [saluteSection,setSaluteSection]=useState(null); // "weight"|"vet"|"symptoms"
  const [menuOpen,setMenuOpen]=useState(false);
  const [dog,setDog]=useState({name:"",breed:"",dob:"",chip:""});
  const [dogPhoto,setDogPhoto]=useState(null);
  const [meds,setMeds]=useState([]);
  const [alones,setAlones]=useState([]);
  const [weights,setWeights]=useState([]);
  const [walks,setWalks]=useState([]);
  const [photos,setPhotos]=useState([]);
  const [vets,setVets]=useState([]);
  const [symptoms,setSymptoms]=useState([]);
  const [friends,setFriends]=useState([]);
  const [places,setPlaces]=useState([]);
  const [ready,setReady]=useState(false);
  const [reminder,setReminder]=useState(null);
  const [form,setForm]=useState({});
  const [mapPending,setMapPending]=useState(null);
  const [editItem,setEditItem]=useState(null);
  const [training,setTraining]=useState([]);   // {commandId, status:"appreso"|"in corso"|"da iniziare", sessions:[{date,notes,riuscito}], goal:bool}
  const [trainingSessions,setTrainingSessions]=useState([]); // log sessioni
  const [walkGoals,setWalkGoals]=useState([]);  // obiettivi passeggiate
  const [obiSection,setObiSection]=useState(null); // "passeggiate"|"addestramento"
  const [notifEnabled,setNotifEnabled]=useState(Notification?.permission==="granted");
  const dogPhotoInputRef=useRef(null);
  const photoInputRef=useRef(null);
  const timerRef=useRef(null);
  const saveEnabled=useRef(false);

  useEffect(()=>{registerSW();},[]);

  useEffect(()=>{
    const init=()=>{
      const setters={dog:setDog,dogPhoto:setDogPhoto,meds:setMeds,alones:setAlones,weights:setWeights,walks:setWalks,photos:setPhotos,vets:setVets,symptoms:setSymptoms,friends:setFriends,places:setPlaces};
      let loaded={};
      const unsubs=KEYS.map(k=>fbListen(k,v=>{setters[k](v);loaded[k]=true;if(KEYS.every(key=>loaded[key])){setTimeout(()=>{saveEnabled.current=true;setReady(true);},300);}}));
      const timeout=setTimeout(()=>{saveEnabled.current=true;setReady(true);},4000);
      return()=>{unsubs.forEach(u=>u());clearTimeout(timeout);};
    };
    if(window._fbReady){const cleanup=init();return cleanup;}
    let cleanup=null;const h=()=>{cleanup=init();};
    window.addEventListener("firebase-ready",h);
    return()=>{window.removeEventListener("firebase-ready",h);cleanup&&cleanup();};
  },[]);

  useEffect(()=>{if(saveEnabled.current)fbSave("dog",dog);},[dog]);
  useEffect(()=>{if(saveEnabled.current)fbSave("dogPhoto",dogPhoto);},[dogPhoto]);
  useEffect(()=>{if(saveEnabled.current){fbSave("meds",meds);if(notifEnabled)scheduleDailyReminders(meds);}},[meds]);
  useEffect(()=>{if(saveEnabled.current)fbSave("alones",alones);},[alones]);
  useEffect(()=>{if(saveEnabled.current)fbSave("weights",weights);},[weights]);
  useEffect(()=>{if(saveEnabled.current)fbSave("walks",walks);},[walks]);
  useEffect(()=>{if(saveEnabled.current)fbSave("photos",photos);},[photos]);
  useEffect(()=>{if(saveEnabled.current){fbSave("vets",vets);if(notifEnabled)scheduleVetReminders(vets);}},[vets]);
  useEffect(()=>{if(saveEnabled.current)fbSave("symptoms",symptoms);},[symptoms]);
  useEffect(()=>{if(saveEnabled.current)fbSave("training",training);},[training]);
  useEffect(()=>{if(saveEnabled.current)fbSave("trainingSessions",trainingSessions);},[trainingSessions]);
  useEffect(()=>{if(saveEnabled.current)fbSave("walkGoals",walkGoals);},[walkGoals]);
  useEffect(()=>{if(saveEnabled.current)fbSave("places",places);},[places]);

  // In-app reminder check
  useEffect(()=>{
    const check=()=>{
      const now=new Date().toTimeString().slice(0,5),td=today();
      meds.forEach(m=>{if(!m.active||!m.reminderTime)return;if(m.reminderTime===now&&(!m.lastReminderDate||m.lastReminderDate!==td)){setReminder(m);setMeds(p=>p.map(x=>x.id===m.id?{...x,lastReminderDate:td}:x));}});
    };
    timerRef.current=setInterval(check,30000);check();
    return()=>clearInterval(timerRef.current);
  },[meds]);

  const f=(k,v)=>setForm(p=>({...p,[k]:v}));
  const addItem=(setter,item)=>{setter(p=>[{...item,id:Date.now()},...p]);setForm({});};
  const delItem=(setter,id)=>setter(p=>p.filter(x=>x.id!==id));
  const updateItem=(setter,id,data)=>setter(p=>p.map(x=>x.id===id?{...x,...data}:x));
  const goTo=id=>{setSection(id);setMenuOpen(false);setForm({});setMapPending(null);setEditItem(null);setSaluteSection(null);};
  const handleDogPhoto=e=>{const file=e.target.files[0];if(!file)return;compressImage(file,data=>setDogPhoto(data));};
  const handlePhotoUpload=e=>{const file=e.target.files[0];if(!file)return;compressImage(file,data=>f("photoData",data));};
  const handleFriendPhoto=e=>{const file=e.target.files[0];if(!file)return;compressImage(file,data=>f("friendPhoto",data));};

  const enableNotifs=async()=>{
    const perm=await Notification.requestPermission();
    if(perm==="granted"){setNotifEnabled(true);scheduleDailyReminders(meds);}
  };

  // Data helpers
  const weightsSorted=useMemo(()=>[...weights].sort((a,b)=>(a.date||"").localeCompare(b.date||"")),[weights]);
  const latestWeight=weightsSorted[weightsSorted.length-1];
  const weightChart=weightsSorted.slice(-12).map(w=>({val:+w.kg,label:fmt(w.date).slice(0,5),dateKey:w.date}));
  const aloneChart=[...alones].sort((a,b)=>(a.date||"").localeCompare(b.date||"")).slice(-12).map(a=>({val:getAloneScore(a.behaviors),label:fmt(a.date).slice(0,5),dateKey:a.date}));
  const walksPerMonth=()=>{const c={};[...walks].forEach(w=>{const m=w.date?.slice(0,7)||"";c[m]=(c[m]||0)+1;});return Object.entries(c).sort().slice(-6).map(([m,v])=>({val:v,label:m.slice(5),dateKey:m}));};
  const sympByType=()=>{const c={};symptoms.forEach(s=>{c[s.symptom]=(c[s.symptom]||0)+1;});return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>({val:v,label:k.slice(0,8)}));};
  const NAV_SECTIONS=SECTIONS.filter(s=>s.id!=="settings");
  const photosByMonth=useMemo(()=>{const groups={};[...photos].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).forEach(p=>{const key=p.date?p.date.slice(0,7):"";if(!groups[key])groups[key]=[];groups[key].push(p);});return groups;},[photos]);
  const randomPhoto=useMemo(()=>{if(!photos||photos.length===0)return null;return photos[Math.floor(Math.random()*photos.length)];},[photos.length]);
  const sortedFriends=useMemo(()=>[...friends].sort((a,b)=>affinityScore(b)-affinityScore(a)),[friends]);

  if(!ready)return <LoadingScreen/>;

  // Shared header
  const Header=()=>(
    <div style={{background:GRAD,borderRadius:"0 0 28px 28px",padding:"16px 18px 18px",marginBottom:20,display:"flex",alignItems:"center",justifyContent:"space-between",boxShadow:"0 6px 24px rgba(24,95,165,0.28)"}}>
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        <div onClick={()=>dogPhotoInputRef.current?.click()} style={{width:52,height:52,borderRadius:"50%",border:"3px solid rgba(255,255,255,0.85)",overflow:"hidden",cursor:"pointer",background:"rgba(255,255,255,0.2)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          {dogPhoto?<img src={dogPhoto} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<span style={{fontSize:26}}>🐶</span>}
        </div>
        <input ref={dogPhotoInputRef} type="file" accept="image/*" onChange={handleDogPhoto} style={{display:"none"}}/>
        <input ref={photoInputRef} type="file" accept="image/*" onChange={handlePhotoUpload} style={{display:"none"}}/>
        <div>
          <p style={{fontWeight:800,fontSize:18,margin:0,color:"white"}}>{dog.name||"Nemo"}</p>
          <p style={{fontSize:12,margin:0,color:"rgba(255,255,255,0.7)",fontWeight:500}}>Kika & Rubi{dog.breed?` · ${dog.breed}`:""}</p>
        </div>
      </div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>goTo("settings")} style={{background:"rgba(255,255,255,0.18)",border:"1px solid rgba(255,255,255,0.3)",borderRadius:12,padding:"8px 12px",cursor:"pointer",color:"white",fontSize:18,lineHeight:1}}>⚙️</button>
        <div style={{position:"relative"}}>
          <button onClick={()=>setMenuOpen(o=>!o)} style={{background:"rgba(255,255,255,0.18)",border:"1px solid rgba(255,255,255,0.3)",borderRadius:12,padding:"8px 14px",cursor:"pointer",color:"white",fontSize:17,fontWeight:700}}>☰</button>
          {menuOpen&&(<div style={{position:"absolute",right:0,top:48,background:"white",borderRadius:18,border:`1px solid ${B.border}`,boxShadow:"0 16px 48px rgba(55,138,221,0.2)",zIndex:100,minWidth:210,overflow:"hidden"}}>{NAV_SECTIONS.map((s,i)=>(<button key={s.id} onClick={()=>goTo(s.id)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",width:"100%",padding:"13px 18px",background:section===s.id?B.bg:"white",color:section===s.id?B.dark:"#334155",border:"none",borderBottom:i<NAV_SECTIONS.length-1?`1px solid ${B.bg}`:"none",cursor:"pointer",fontSize:14,fontWeight:section===s.id?700:400}}>{s.label}{section===s.id&&<span style={{color:B.mid,fontSize:13,fontWeight:700}}>✓</span>}</button>))}</div>)}
        </div>
      </div>
    </div>
  );

  return(
    <div style={{maxWidth:680,margin:"0 auto",padding:"0 0 2rem",minHeight:"100vh"}}>
      <PawBg/>
      {editItem&&(<EditModal item={editItem.item} fields={editItem.fields} title={editItem.title} onSave={data=>updateItem(editItem.setter,editItem.item.id,data)} onClose={()=>setEditItem(null)}/>)}
      <div style={{position:"relative",zIndex:1}}>
        <Header/>

        {/* REMINDER */}
        {reminder&&(<div style={{margin:"0 0 14px",background:"linear-gradient(135deg,#fef9c3,#fef3c7)",border:"1px solid #fde047",borderRadius:14,padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontWeight:700,color:"#854d0e"}}>⏰ {reminder.name} — {reminder.dose}</span><Btn small onClick={()=>setReminder(null)}>✓ Ho dato</Btn></div>)}

        {/* HOME */}
        {section==="home"&&(
          <div>
            <div style={{background:GRAD,borderRadius:24,marginBottom:16,boxShadow:"0 8px 28px rgba(24,95,165,0.25)",position:"relative",overflow:"hidden"}}>
              <div onClick={()=>dogPhotoInputRef.current?.click()} style={{width:"100%",height:220,overflow:"hidden",cursor:"pointer",position:"relative",background:"rgba(255,255,255,0.1)",display:"flex",alignItems:"center",justifyContent:"center"}}>
                {dogPhoto?<img src={dogPhoto} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<div style={{textAlign:"center"}}><span style={{fontSize:64}}>🐶</span><p style={{color:"rgba(255,255,255,0.7)",fontSize:13,marginTop:8}}>Tocca per aggiungere foto</p></div>}
                <div style={{position:"absolute",inset:0,background:"linear-gradient(to bottom,transparent 50%,rgba(10,30,80,0.65) 100%)"}}/>
                <div onClick={e=>{e.stopPropagation();dogPhotoInputRef.current?.click();}} style={{position:"absolute",top:12,right:12,width:28,height:28,borderRadius:"50%",background:"rgba(255,255,255,0.9)",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:13}}>✏️</div>
                <div style={{position:"absolute",bottom:0,left:0,right:0,padding:"16px 18px"}}>
                  <p style={{fontWeight:900,fontSize:28,margin:"0 0 2px",color:"white",textShadow:"0 1px 4px rgba(0,0,0,0.3)"}}>{dog.name||"Nemo"}</p>
                  <p style={{fontSize:13,margin:0,color:"rgba(255,255,255,0.8)",fontWeight:500}}>🏠 Kika & Rubi{dog.breed?` · ${dog.breed}`:""}</p>
                </div>
              </div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",padding:"12px 14px"}}>
                {[
                  {label:"Chip",val:(dog.chip||"—").slice(0,10)},
                  {label:"Farmaci",val:meds.filter(m=>m.active).length+"💊"},
                  {label:"Peso",val:latestWeight?latestWeight.kg+"kg":"—"},
                  {label:"Visita",val:vets.find(v=>v.next&&v.next>=today())?.next?fmt(vets.find(v=>v.next&&v.next>=today()).next).slice(0,8):"—"},
                ].map(c=>(<div key={c.label} style={{background:"rgba(255,255,255,0.14)",borderRadius:10,padding:"5px 10px"}}>
                  <p style={{fontSize:9,color:"rgba(255,255,255,0.6)",margin:"0 0 1px",textTransform:"uppercase",letterSpacing:"0.5px",fontWeight:600}}>{c.label}</p>
                  <p style={{fontSize:13,fontWeight:700,color:"white",margin:0,whiteSpace:"nowrap"}}>{c.val}</p>
                </div>))}
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:16}}>
              {[{label:"Amici",val:friends.length,color:"#378ADD",bg:"linear-gradient(135deg,#e8f4fd,#dbeeff)"},{label:"Giri",val:walks.length,color:"#1D9E75",bg:"linear-gradient(135deg,#dcfce7,#bbf7d0)"},{label:"Foto",val:photos.length,color:"#7C3AED",bg:"linear-gradient(135deg,#ede9fe,#ddd6fe)"}].map(c=>(<div key={c.label} style={{background:c.bg,borderRadius:16,padding:"14px 10px",textAlign:"center",border:"1px solid rgba(255,255,255,0.8)"}}><p style={{fontSize:26,fontWeight:900,margin:"0 0 3px",color:c.color}}>{c.val}</p><p style={{fontSize:12,color:c.color,margin:0,fontWeight:600,opacity:0.8}}>{c.label}</p></div>))}
            </div>
            {randomPhoto?(<div style={{borderRadius:20,overflow:"hidden",marginBottom:16,boxShadow:"0 6px 20px rgba(55,138,221,0.15)",position:"relative"}}><img src={randomPhoto.photoData} style={{width:"100%",height:200,objectFit:"cover",display:"block"}}/><div style={{position:"absolute",inset:0,background:"linear-gradient(to bottom,transparent 40%,rgba(10,20,60,0.75) 100%)"}}/><div style={{position:"absolute",top:12,left:14}}><span style={{background:"rgba(255,255,255,0.2)",backdropFilter:"blur(8px)",color:"white",fontSize:11,fontWeight:700,padding:"4px 10px",borderRadius:20,border:"1px solid rgba(255,255,255,0.3)",textTransform:"uppercase",letterSpacing:"0.8px"}}>✨ Ricordo</span></div><div style={{position:"absolute",bottom:0,left:0,right:0,padding:"14px 16px"}}>{randomPhoto.caption&&<p style={{fontWeight:700,fontSize:15,color:"white",margin:"0 0 3px",textShadow:"0 1px 4px rgba(0,0,0,0.4)"}}>{randomPhoto.caption}</p>}<p style={{fontSize:12,color:"rgba(255,255,255,0.75)",margin:0}}>{fmt(randomPhoto.date)}{randomPhoto.place?` · 📍 ${randomPhoto.place}`:""}</p></div></div>):(<div onClick={()=>goTo("photos")} style={{borderRadius:20,padding:"20px",background:"linear-gradient(135deg,#ede9fe,#ddd6fe)",border:"2px dashed #a78bfa",textAlign:"center",cursor:"pointer",marginBottom:16}}><p style={{fontSize:28,margin:"0 0 6px"}}>📸</p><p style={{fontSize:14,color:"#7C3AED",fontWeight:600,margin:0}}>Aggiungi le prime foto di Nemo</p></div>)}
          </div>
        )}

        {/* SETTINGS */}
        {section==="settings"&&(
          <div>
            <Card><p style={{fontWeight:700,fontSize:13,color:B.dark,margin:"0 0 14px",textTransform:"uppercase",letterSpacing:"0.8px"}}>Modifica profilo</p><Input label="Nome" value={dog.name} onChange={e=>setDog(p=>({...p,name:e.target.value}))} placeholder="es. Nemo"/><Input label="Razza" value={dog.breed} onChange={e=>setDog(p=>({...p,breed:e.target.value}))} placeholder="es. Labrador"/><Input label="Data di nascita" type="date" value={dog.dob} onChange={e=>setDog(p=>({...p,dob:e.target.value}))}/><Input label="Numero chip" value={dog.chip} onChange={e=>setDog(p=>({...p,chip:e.target.value}))}/><Btn accent onClick={()=>dogPhotoInputRef.current?.click()}>📷 Cambia foto profilo</Btn><p style={{fontSize:12,color:"#94a3b8",marginTop:6}}>Salvato automaticamente su cloud ☁️</p></Card>
            <Card>
              <p style={{fontWeight:700,fontSize:13,color:B.dark,margin:"0 0 10px",textTransform:"uppercase",letterSpacing:"0.8px"}}>🔔 Notifiche farmaci</p>
              {notifEnabled?(<div style={{display:"flex",alignItems:"center",gap:10}}><span style={{fontSize:20}}>✅</span><div><p style={{fontWeight:600,margin:0,color:"#166534"}}>Notifiche attive</p><p style={{fontSize:12,color:"#64748b",margin:0}}>Riceverai un promemoria per ogni farmaco</p></div></div>):(<div><p style={{fontSize:14,color:"#64748b",marginBottom:10}}>Attiva le notifiche push per ricevere il promemoria dei farmaci anche quando l'app è chiusa.</p><Btn accent onClick={enableNotifs}>🔔 Attiva notifiche</Btn></div>)}
            </Card>
          </div>
        )}

        {/* FARMACI */}
        {section==="meds"&&(
          <div>
            <Card>
              <p style={{fontWeight:700,marginBottom:12,color:B.text}}>Aggiungi farmaco</p>
              <Input label="Nome" value={form.name||""} onChange={e=>f("name",e.target.value)} placeholder="es. Antibiotico"/>
              <Input label="Dose" value={form.dose||""} onChange={e=>f("dose",e.target.value)} placeholder="es. 1 compressa"/>
              <Input label="Frequenza" value={form.freq||""} onChange={e=>f("freq",e.target.value)} placeholder="es. 2 volte al giorno"/>
              <Input label="Inizio" type="date" value={form.start||today()} onChange={e=>f("start",e.target.value)}/>
              <Input label="Fine (opzionale)" type="date" value={form.end||""} onChange={e=>f("end",e.target.value)}/>
              <div style={{marginBottom:10}}><label style={{fontSize:13,color:B.dark,display:"block",marginBottom:4,fontWeight:600}}>⏰ Orario reminder</label><input type="time" value={form.reminderTime||""} onChange={e=>f("reminderTime",e.target.value)} style={{width:"100%",borderRadius:10,border:`1.5px solid ${B.border}`,padding:"9px 12px",fontSize:14,background:"#f8fbff"}}/></div>
              <Input label="Note" value={form.notes||""} onChange={e=>f("notes",e.target.value)}/>
              <Btn accent onClick={()=>{if(!form.name)return;addItem(setMeds,{...form,active:true,date:today()});}}>+ Aggiungi</Btn>
            </Card>
            {!notifEnabled&&(<div style={{background:"#fef9c3",border:"1px solid #fde047",borderRadius:12,padding:"10px 14px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:13,color:"#854d0e"}}>Attiva le notifiche per ricevere il reminder</span><Btn small onClick={enableNotifs}>Attiva</Btn></div>)}
            {meds.length===0&&<Empty msg="Nessun farmaco registrato"/>}
            {meds.map(m=>(
              <Card key={m.id}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div style={{flex:1}}><p style={{fontWeight:700,margin:"0 0 4px",color:B.text}}>{m.name}</p><p style={{fontSize:13,color:"#64748b",margin:"0 0 6px"}}>{m.dose} — {m.freq}</p>{m.reminderTime&&<Tag color="warning">⏰ {m.reminderTime}</Tag>}<Tag color={m.active?"success":"secondary"}>{m.active?"Attivo":"Finito"}</Tag></div>

            <GroupedList items={weightsSorted.slice().reverse()} emptyMsg="Nessun peso registrato" renderItem={w=>(<Card key={w.id}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><p style={{fontWeight:700,margin:"0 0 2px",color:B.text}}>{w.kg} kg</p><p style={{fontSize:13,color:"#64748b",margin:0}}>{fmt(w.date)}</p></div><div style={{display:"flex",gap:4}}><EditPen onClick={()=>setEditItem({setter:setWeights,item:w,title:"Modifica peso",fields:[{key:"date",label:"Data",type:"date"},{key:"kg",label:"Peso (kg)",type:"number"},{key:"notes",label:"Note"}]})}/><Btn small danger onClick={()=>delItem(setWeights,w.id)}>✕</Btn></div></div></Card>)}/>

            {vets.filter(v=>v.next&&v.next>=today()).length>0&&(<Card style={{background:"linear-gradient(135deg,#f0fdf4,#dcfce7)",border:"1px solid #86efac"}}><p style={{fontWeight:700,margin:"0 0 10px",color:"#166534"}}>📅 Prossimi appuntamenti</p>{vets.filter(v=>v.next&&v.next>=today()).sort((a,b)=>a.next.localeCompare(b.next)).map(v=>(<div key={v.id} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderTop:"1px solid #bbf7d0",fontSize:13,color:"#166534"}}><span style={{fontWeight:500}}>{v.type}{v.vet?` — ${v.vet}`:""}</span><span style={{fontWeight:700}}>{fmt(v.next)}</span></div>))}</Card>)}

        {/* PASSEGGIATE */}
        {section==="walks"&&(
          <div>

              <WalkMap places={places} onAddPlace={(lat,lng)=>setMapPending({lat,lng})}/>
              {mapPending&&(<div style={{marginTop:12,padding:14,background:B.bg,borderRadius:12,border:`1.5px solid ${B.border}`}}><Input label="Nome luogo" value={form.placeName||""} onChange={e=>f("placeName",e.target.value)} placeholder="es. Parco Centrale"/><Input label="Note" value={form.placeNotes||""} onChange={e=>f("placeNotes",e.target.value)}/><div style={{marginBottom:10,display:"flex",flexWrap:"wrap",gap:7}}>{PLACE_EMOJIS.map(em=><button key={em} onClick={()=>f("placeEmoji",em)} style={{fontSize:22,padding:"5px 9px",borderRadius:10,border:`1.5px solid ${form.placeEmoji===em?B.mid:B.border}`,background:form.placeEmoji===em?B.bg:"white",cursor:"pointer"}}>{em}</button>)}</div><Btn accent onClick={()=>{if(!form.placeName)return;setPlaces(p=>[...p,{id:Date.now(),name:form.placeName,notes:form.placeNotes,lat:mapPending.lat,lng:mapPending.lng,emoji:form.placeEmoji||"📍"}]);setMapPending(null);setForm({});}}>Salva</Btn><Btn onClick={()=>{setMapPending(null);setForm({});}}>Annulla</Btn></div>)}
            </Card>
            {places.length>0&&(<Card><p style={{fontWeight:700,marginBottom:10,color:B.text}}>Luoghi ({places.length})</p>{places.map(p=>(<div key={p.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderTop:`1px solid ${B.bg}`}}><div style={{display:"flex",alignItems:"center",gap:9}}><span style={{fontSize:22}}>{p.emoji}</span><p style={{fontWeight:500,margin:0,fontSize:14}}>{p.name}</p></div><Btn small danger onClick={()=>delItem(setPlaces,p.id)}>✕</Btn></div>))}</Card>)}
            <Card>
              <p style={{fontWeight:700,marginBottom:12,color:B.text}}>Registra giro</p>
              <Input label="Data" type="date" value={form.wDate||today()} onChange={e=>f("wDate",e.target.value)}/>

              <Input label="Km percorsi" type="number" step="0.1" value={form.wKm||""} onChange={e=>f("wKm",e.target.value)}/>
              {places.length>0&&(
                <div style={{marginBottom:12}}>
                  <label style={{fontSize:13,color:B.dark,display:"block",marginBottom:6,fontWeight:600}}>Luoghi toccati</label>
                  <select value="" onChange={e=>{if(e.target.value){const c=form.wPlaces||[];if(!c.includes(+e.target.value))f("wPlaces",[...c,+e.target.value]);}}} style={{width:"100%",borderRadius:10,border:`1.5px solid ${B.border}`,padding:"9px 12px",background:"#f8fbff",fontSize:14,marginBottom:8}}>
                    <option value="">+ Seleziona luogo...</option>
                    {places.filter(p=>!(form.wPlaces||[]).includes(p.id)).map(p=><option key={p.id} value={p.id}>{p.emoji} {p.name}</option>)}
                  </select>
                  {(form.wPlaces||[]).length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:6}}>{(form.wPlaces||[]).map(pid=>{const p=places.find(x=>x.id===pid);return p?<span key={pid} style={{background:B.bg,border:`1px solid ${B.border}`,borderRadius:20,padding:"3px 10px",fontSize:13,display:"flex",alignItems:"center",gap:5}}>{p.emoji} {p.name}<button onClick={()=>f("wPlaces",(form.wPlaces||[]).filter(x=>x!==pid))} style={{background:"none",border:"none",cursor:"pointer",fontSize:12,color:"#b91c1c",padding:0,marginLeft:2}}>✕</button></span>:null;})}</div>}

              <Input label="Note" value={form.wNotes||""} onChange={e=>f("wNotes",e.target.value)}/>
              <Btn accent onClick={()=>addItem(setWalks,{date:form.wDate||today(),mins:form.wMins,km:form.wKm,placeIds:form.wPlaces||[],mood:form.wMood||3,notes:form.wNotes})}>+ Salva giro</Btn>
            </Card>
            {walks.length>0&&(<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:14}}>{[{label:"Giri",val:walks.length},{label:"Km totali",val:walks.reduce((s,w)=>s+(+(w.km||0)),0).toFixed(1)},{label:"Ore totali",val:(walks.reduce((s,w)=>s+(+(w.mins||0)),0)/60).toFixed(1)+"h"}].map(c=>(<div key={c.label} style={{background:"rgba(255,255,255,0.9)",borderRadius:12,padding:"0.8rem",textAlign:"center",border:`1px solid ${B.border}`}}><p style={{fontSize:11,color:B.dark,margin:"0 0 3px",fontWeight:600}}>{c.label}</p><p style={{fontSize:18,fontWeight:800,margin:0,color:B.text}}>{c.val}</p></div>))}</div>)}
            {walks.length===0&&<Empty msg="Nessun giro registrato"/>}
            <GroupedList items={walks} emptyMsg="Nessun giro registrato" renderItem={w=>{
              const wps=places.filter(p=>(w.placeIds||[]).includes(p.id));
              return(<Card key={w.id}><div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}><div style={{flex:1}}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}><p style={{fontWeight:700,margin:0,color:B.text}}>{fmt(w.date)}</p><span>{moodEmoji[w.mood]}</span></div><p style={{fontSize:13,color:"#64748b",margin:"0 0 4px"}}>{w.mins?`${w.mins} min`:""}{w.km?` · ${w.km} km`:""}</p>{wps.length>0&&<div style={{marginBottom:4}}>{wps.map(p=><Tag key={p.id} color="info">{p.emoji} {p.name}</Tag>)}</div>}{w.notes&&<p style={{fontSize:12,color:"#94a3b8",margin:0}}>{w.notes}</p>}</div><div style={{display:"flex",gap:4}}><EditPen onClick={()=>setEditItem({setter:setWalks,item:w,title:"Modifica giro",fields:[{key:"date",label:"Data",type:"date"},{key:"mins",label:"Durata (min)",type:"number"},{key:"km",label:"Km",type:"number"},{key:"notes",label:"Note",type:"textarea"}]})}/><Btn small danger onClick={()=>delItem(setWalks,w.id)}>✕</Btn></div></div></Card>);
            }}/>
          </div>
        )}

        {/* DIARIO FOTO */}
        {section==="photos"&&(
          <div>
            <Card><p style={{fontWeight:700,marginBottom:12,color:B.text}}>Aggiungi foto</p><Input label="Data" type="date" value={form.date||today()} onChange={e=>f("date",e.target.value)}/><Input label="Luogo / occasione" value={form.place||""} onChange={e=>f("place",e.target.value)} placeholder="es. Parco della Villa"/><div style={{marginBottom:10}}><label style={{fontSize:13,color:B.dark,display:"block",marginBottom:4,fontWeight:600}}>Foto</label><input type="file" accept="image/*" onChange={handlePhotoUpload} style={{fontSize:13}}/></div>{form.photoData&&<img src={form.photoData} style={{width:"100%",borderRadius:12,marginBottom:10,maxHeight:200,objectFit:"cover"}}/>}<Input label="Didascalia" value={form.caption||""} onChange={e=>f("caption",e.target.value)} placeholder="es. Prima passeggiata al mare!"/><Btn accent onClick={()=>{if(!form.photoData)return;addItem(setPhotos,form);}}>+ Aggiungi</Btn></Card>
            {photos.length===0&&<Empty msg="Nessuna foto nel diario"/>}
            {Object.entries(photosByMonth).map(([monthKey,monthPhotos])=>(
              <div key={monthKey}>
                <div onClick={()=>setPhotoMonth(photoMonth===monthKey?null:monthKey)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px",background:GRAD,borderRadius:14,marginBottom:8,cursor:"pointer",boxShadow:"0 2px 8px rgba(55,138,221,0.2)"}}>
                  <p style={{fontWeight:700,fontSize:15,color:"white",margin:0,textTransform:"capitalize"}}>{fmtMonth(monthKey+"-01")}</p>
                  <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{background:"rgba(255,255,255,0.25)",color:"white",fontSize:12,fontWeight:700,padding:"2px 9px",borderRadius:12}}>{monthPhotos.length} foto</span><span style={{color:"white",fontSize:16}}>{photoMonth===monthKey?"▲":"▼"}</span></div>
                </div>
                {(photoMonth===monthKey||photoMonth===null)&&(
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
                    {monthPhotos.map(p=>(<div key={p.id} style={{background:"white",border:`1px solid ${B.border}`,borderRadius:16,overflow:"hidden",boxShadow:"0 3px 10px rgba(55,138,221,0.1)"}}><img src={p.photoData} style={{width:"100%",height:130,objectFit:"cover",display:"block"}}/><div style={{padding:"9px 11px"}}><p style={{fontSize:12,color:B.dark,margin:"0 0 2px",fontWeight:600}}>{fmt(p.date)}{p.place?` · ${p.place}`:""}</p>{p.caption&&<p style={{fontSize:12,color:"#64748b",margin:0}}>{p.caption}</p>}<div style={{display:"flex",gap:6,marginTop:5}}><EditPen onClick={()=>setEditItem({setter:setPhotos,item:p,title:"Modifica foto",fields:[{key:"date",label:"Data",type:"date"},{key:"place",label:"Luogo"},{key:"caption",label:"Didascalia"}]})}/><button onClick={()=>delItem(setPhotos,p.id)} style={{fontSize:11,color:"#b91c1c",background:"none",border:"none",cursor:"pointer",padding:0}}>rimuovi</button></div></div></div>))}
                  </div>
                )}
              </div>
            ))}
          </div>
        )}

        {/* AMICI */}
        {section==="friends"&&(
          <div>
            {sortedFriends.length>0&&(<Card style={{background:"linear-gradient(135deg,#fef9c3,#fef3c7)",border:"1px solid #fde047",marginBottom:14}}><p style={{fontWeight:700,margin:"0 0 10px",color:"#854d0e"}}>🏆 Classifica affinità</p>{sortedFriends.map((fr,i)=>{const score=affinityScore(fr);const lbl=affinityLabel(score);return(<div key={fr.id} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderTop:i>0?"1px solid #fde047":"none"}}><span style={{fontSize:18,fontWeight:800,color:"#854d0e",minWidth:24}}>{i===0?"🥇":i===1?"🥈":i===2?"🥉":`${i+1}.`}</span>{fr.photo?<img src={fr.photo} style={{width:36,height:36,borderRadius:"50%",objectFit:"cover",border:"2px solid #fde047"}}/>:<div style={{width:36,height:36,borderRadius:"50%",background:"#fde047",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>🐕</div>}<div style={{flex:1}}><p style={{fontWeight:700,margin:0,fontSize:14,color:"#854d0e"}}>{fr.name}</p><div style={{height:6,background:"#fde047",borderRadius:3,marginTop:3,overflow:"hidden"}}><div style={{height:"100%",width:`${score}%`,background:"#d97706",borderRadius:3}}/></div></div><div style={{textAlign:"right"}}><p style={{fontWeight:800,fontSize:16,margin:0,color:"#92400e"}}>{score}</p><p style={{fontSize:10,color:"#92400e",margin:0}}>/100</p></div></div>);})}
            </Card>)}
            <Card>
              <p style={{fontWeight:700,marginBottom:12,color:B.text}}>Aggiungi amico</p>
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
                <div onClick={()=>document.getElementById("friendPhotoInput").click()} style={{width:64,height:64,borderRadius:"50%",border:`2px dashed ${B.border}`,overflow:"hidden",cursor:"pointer",background:B.bg,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{form.friendPhoto?<img src={form.friendPhoto} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<span style={{fontSize:28}}>🐕</span>}</div>
                <Btn small onClick={()=>document.getElementById("friendPhotoInput").click()}>📷 Foto avatar</Btn>
                <input id="friendPhotoInput" type="file" accept="image/*" onChange={handleFriendPhoto} style={{display:"none"}}/>
              </div>
              <Input label="Nome del cane" value={form.name||""} onChange={e=>f("name",e.target.value)} placeholder="es. Fido"/>
              <Input label="Razza" value={form.breed||""} onChange={e=>f("breed",e.target.value)}/>
              <Input label="Proprietario" value={form.owner||""} onChange={e=>f("owner",e.target.value)}/>
              <Input label="Quanti cani" type="number" value={form.count||""} onChange={e=>f("count",e.target.value)} placeholder="es. 1"/>
              <div style={{marginBottom:14}}><label style={{fontSize:13,color:B.dark,display:"block",marginBottom:8,fontWeight:600}}>Reazione di Nemo</label><div style={{display:"flex",gap:8}}>{REACTION_OPTIONS.map(r=>(<label key={r.val} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:5,cursor:"pointer",padding:"11px 4px",borderRadius:12,border:`2px solid ${form.reaction===r.val?B.mid:B.border}`,background:form.reaction===r.val?B.bg:"white"}}><input type="radio" name="reaction" value={r.val} checked={form.reaction===r.val} onChange={()=>f("reaction",r.val)} style={{display:"none"}}/><span style={{fontSize:26}}>{r.label.split(" ")[0]}</span><span style={{fontSize:12,color:B.dark,fontWeight:600}}>{r.label.split(" ")[1]}</span></label>))}</div></div>
              <div style={{marginBottom:14}}>
                <label style={{fontSize:13,color:B.dark,display:"block",marginBottom:8,fontWeight:700}}>Parametri affinità (0–20 ciascuno)</label>
                {AFFINITY_PARAMS.map(p=>(<div key={p.id} style={{marginBottom:10}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><label style={{fontSize:13,color:B.dark,fontWeight:500}}>{p.label}</label><span style={{fontSize:13,fontWeight:700,color:B.mid}}>{form.affinity?.[p.id]||0}/20</span></div><input type="range" min={0} max={20} step={1} value={form.affinity?.[p.id]||0} onChange={e=>f("affinity",{...(form.affinity||{}),[p.id]:+e.target.value})} style={{width:"100%"}}/></div>))}
                <div style={{background:B.bg,borderRadius:10,padding:"8px 12px",textAlign:"center"}}><span style={{fontWeight:800,fontSize:18,color:B.mid}}>{AFFINITY_PARAMS.reduce((s,p)=>s+(+(form.affinity?.[p.id]||0)),0)}</span><span style={{fontSize:13,color:B.dark}}>/100 — {affinityLabel(AFFINITY_PARAMS.reduce((s,p)=>s+(+(form.affinity?.[p.id]||0)),0)).label}</span></div>
              </div>
              <div style={{marginBottom:10}}><label style={{fontSize:13,color:B.dark,display:"block",marginBottom:4,fontWeight:600}}>Note</label><textarea value={form.notes||""} onChange={e=>f("notes",e.target.value)} style={{width:"100%",minHeight:60,padding:"9px 12px",borderRadius:10,border:`1.5px solid ${B.border}`,background:"#f8fbff",fontSize:14,resize:"vertical"}}/></div>
              <Input label="Data primo incontro" type="date" value={form.metDate||today()} onChange={e=>f("metDate",e.target.value)}/>
              <Btn accent onClick={()=>{if(!form.name)return;addItem(setFriends,{...form,reaction:form.reaction||"neutro",photo:form.friendPhoto||null});}}>+ Aggiungi amico</Btn>
            </Card>
            {friends.length===0&&<Empty msg="Nessun amico registrato"/>}
            {sortedFriends.map(fr=>{const score=affinityScore(fr);const lbl=affinityLabel(score);const rx=REACTION_OPTIONS.find(r=>r.val===fr.reaction)||REACTION_OPTIONS[1];return(<Card key={fr.id}><div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}><div style={{flex:1}}><div style={{display:"flex",alignItems:"center",gap:11,marginBottom:8}}>{fr.photo?<img src={fr.photo} style={{width:50,height:50,borderRadius:"50%",objectFit:"cover",border:`2px solid ${B.border}`}}/>:<div style={{width:50,height:50,borderRadius:"50%",background:B.bg,border:`2px solid ${B.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>🐕</div>}<div><p style={{fontWeight:700,margin:0,color:B.text}}>{fr.name}{fr.breed?` · ${fr.breed}`:""}</p>{fr.owner&&<p style={{fontSize:13,color:"#64748b",margin:0}}>di {fr.owner}{fr.count&&fr.count>1?` · ${fr.count} cani`:""}</p>}</div></div><div style={{marginBottom:8}}><Tag color={rx.color}>{rx.label}</Tag></div><div style={{background:lbl.bg,borderRadius:10,padding:"8px 12px",marginBottom:6}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontSize:12,fontWeight:700,color:lbl.color}}>{lbl.label}</span><span style={{fontSize:14,fontWeight:800,color:lbl.color}}>{score}/100</span></div><div style={{height:7,background:"rgba(0,0,0,0.1)",borderRadius:4,overflow:"hidden"}}><div style={{height:"100%",width:`${score}%`,background:lbl.color,borderRadius:4}}/></div></div>{fr.notes&&<div style={{background:B.bg,borderRadius:10,padding:"8px 11px"}}><p style={{fontSize:13,color:B.dark,margin:0,fontStyle:"italic"}}>{fr.notes}</p></div>}</div><div style={{display:"flex",gap:4,marginLeft:8}}><EditPen onClick={()=>setEditItem({setter:setFriends,item:fr,title:"Modifica amico",fields:[{key:"name",label:"Nome"},{key:"breed",label:"Razza"},{key:"owner",label:"Proprietario"},{key:"count",label:"N° cani",type:"number"},{key:"reaction",label:"Reazione",type:"select",options:REACTION_OPTIONS.map(r=>({val:r.val,label:r.label}))},{key:"notes",label:"Note",type:"textarea"},{key:"metDate",label:"Data primo incontro",type:"date"}]})}/><Btn small danger onClick={()=>delItem(setFriends,fr.id)}>✕</Btn></div></div></Card>);})}
          </div>
        )}

        {/* GRAFICI */}
        {section==="charts"&&(
          <div>
            <Card><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><p style={{fontWeight:700,margin:0,color:B.text}}>Peso (ordine cronologico)</p><Trend data={weightChart}/></div>{weightChart.length>=2?<LineChart data={weightChart} color={B.mid}/>:<Empty msg="Aggiungi almeno 2 pesate"/>}{weights.length>0&&(<div style={{display:"flex",gap:8,marginTop:12}}>{[{label:"Attuale",val:latestWeight?.kg+" kg"},{label:"Minimo",val:Math.min(...weights.map(w=>+w.kg))+" kg"},{label:"Massimo",val:Math.max(...weights.map(w=>+w.kg))+" kg"}].map(c=>(<div key={c.label} style={{flex:1,background:B.bg,borderRadius:10,padding:"9px",textAlign:"center"}}><p style={{fontSize:11,color:B.dark,margin:0,fontWeight:600}}>{c.label}</p><p style={{fontSize:16,fontWeight:800,margin:0,color:B.text}}>{c.val}</p></div>))}</div>)}</Card>
            <Card><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><p style={{fontWeight:700,margin:0,color:B.text}}>Solo a casa — punteggio</p><Trend data={aloneChart}/></div>{aloneChart.length>=2?<LineChart data={aloneChart} color="#1D9E75"/>:<Empty msg="Aggiungi almeno 2 sessioni"/>}</Card>
            <Card><p style={{fontWeight:700,margin:"0 0 10px",color:B.text}}>Passeggiate per mese</p>{walks.length>=2?<BarChart data={walksPerMonth()} color={B.mid}/>:<Empty msg="Aggiungi almeno 2 giri"/>}</Card>
            <Card><p style={{fontWeight:700,margin:"0 0 10px",color:B.text}}>Sintomi più frequenti</p>{symptoms.length>=2?<BarChart data={sympByType()} color="#E24B4A"/>:<Empty msg="Aggiungi almeno 2 sintomi"/>}{symptoms.length>0&&(<div style={{display:"flex",gap:8,marginTop:12}}>{[{label:"Gravi",val:symptoms.filter(s=>s.severity==="grave").length,bg:"#fee2e2",tc:"#b91c1c"},{label:"Moderati",val:symptoms.filter(s=>s.severity==="moderata").length,bg:"#fef9c3",tc:"#854d0e"},{label:"Lievi",val:symptoms.filter(s=>s.severity==="lieve").length,bg:"#dcfce7",tc:"#166534"}].map(c=>(<div key={c.label} style={{flex:1,background:c.bg,borderRadius:10,padding:"9px",textAlign:"center"}}><p style={{fontSize:11,color:c.tc,margin:0,fontWeight:600}}>{c.label}</p><p style={{fontSize:16,fontWeight:800,margin:0,color:c.tc}}>{c.val}</p></div>))}</div>)}</Card>
            {friends.length>0&&(<Card><p style={{fontWeight:700,margin:"0 0 12px",color:B.text}}>🏆 Affinità amici</p>{sortedFriends.map(fr=>{const score=affinityScore(fr);const lbl=affinityLabel(score);return(<div key={fr.id} style={{marginBottom:10}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontSize:13,fontWeight:600,color:B.text}}>{fr.name}</span><span style={{fontSize:13,fontWeight:800,color:lbl.color}}>{score}/100</span></div><div style={{height:10,background:B.bg,borderRadius:5,overflow:"hidden"}}><div style={{height:"100%",width:`${score}%`,background:B.mid,borderRadius:5}}/></div></div>);})}</Card>)}
          </div>
        )}

      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
