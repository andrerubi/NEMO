function compressImage(file,cb){
  const img=new Image(),r=new FileReader();
  r.onload=ev=>{img.onload=()=>{const c=document.createElement("canvas");const MAX=600;let w=img.width,h=img.height;if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);cb(c.toDataURL("image/jpeg",0.7));};img.src=ev.target.result;};r.readAsDataURL(file);
}

function affinityScore(f){
  if(!f.affinity)return 0;
  return AFFINITY_PARAMS.reduce((s,p)=>s+(+(f.affinity[p.id]||0)),0);
}
function affinityLabel(score){
  if(score>=80)return{label:"🏆 Migliore amico",color:"#166534",bg:"#dcfce7"};

}

function LineChart({data,color="#378ADD"}){
  if(!data||data.length<2)return <Empty msg="Servono almeno 2 dati"/>;
  const W=500,H=120,PAD=32;
  const sorted=[...data].sort((a,b)=>a.dateKey?.localeCompare(b.dateKey||"")||0);
  const vals=sorted.map(d=>d.val);
  const max=Math.max(...vals),min=Math.min(...vals),range=max-min||1;
  const pts=sorted.map((d,i)=>({x:PAD+(i/(sorted.length-1))*(W-PAD*2),y:PAD+((max-d.val)/range)*(H-PAD*2),label:d.label}));
  const path=pts.map((p,i)=>`${i===0?"M":"L"} ${p.x} ${p.y}`).join(" ");
  const area=`${path} L ${pts[pts.length-1].x} ${H-8} L ${pts[0].x} ${H-8} Z`;
  return(<svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}}>{[0,1,2].map(i=>{const y=PAD+(i/2)*(H-PAD*1.5);return(<g key={i}><line x1={PAD} y1={y} x2={W-8} y2={y} stroke={B.border} strokeWidth="1"/><text x={PAD-4} y={y+4} fontSize="9" fill={B.dark} textAnchor="end">{(max-(i/2)*range).toFixed(1)}</text></g>);})} <path d={area} fill={color} fillOpacity="0.13"/><path d={path} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>{pts.map((p,i)=><g key={i}><circle cx={p.x} cy={p.y} r="5" fill="#fff" stroke={color} strokeWidth="2"/><text x={p.x} y={H} fontSize="9" fill={B.dark} textAnchor="middle">{p.label}</text></g>)}</svg>);
}
function BarChart({data,color="#378ADD"}){
  if(!data||data.length===0)return <Empty msg="Nessun dato"/>;
  const W=500,H=110,PAD=28;
  const sorted=[...data].sort((a,b)=>a.dateKey?.localeCompare(b.dateKey||"")||0);
  const max=Math.max(...sorted.map(d=>d.val),1);
  const bw=Math.min(38,(W-PAD*2)/sorted.length-6);
  return(<svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}}>{sorted.map((d,i)=>{const bh=((d.val/max)*(H-PAD-10));const x=PAD+i*((W-PAD*2)/sorted.length)+((W-PAD*2)/sorted.length-bw)/2;const y=H-PAD-bh;return(<g key={i}><rect x={x} y={y} width={bw} height={bh} rx="5" fill={color} fillOpacity="0.75"/><text x={x+bw/2} y={y-3} fontSize="9" fill={B.dark} textAnchor="middle">{d.val}</text><text x={x+bw/2} y={H-2} fontSize="9" fill={B.dark} textAnchor="middle">{d.label}</text></g>);})} </svg>);
}
function Trend({data}){
  if(!data||data.length<2)return null;
  const sorted=[...data].sort((a,b)=>a.dateKey?.localeCompare(b.dateKey||"")||0);
  const diff=sorted[sorted.length-1].val-sorted[sorted.length-2].val;
  if(diff===0)return <Tag color="secondary">= stabile</Tag>;
  return <Tag color={diff>0?"success":"danger"}>{diff>0?"↑ miglioramento":"↓ peggioramento"}</Tag>;
}

function WalkMap({places,onAddPlace}){

  useEffect(()=>{if(!mapReady||!leafletRef.current)return;const L=window.L,map=leafletRef.current;markersRef.current.forEach(m=>m.remove());markersRef.current=[];places.forEach(p=>{const icon=L.divIcon({className:"",html:`<div style="background:${B.mid};color:white;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:15px;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.2)">${p.emoji||"📍"}</div>`,iconSize:[30,30],iconAnchor:[15,15]});markersRef.current.push(L.marker([p.lat,p.lng],{icon}).addTo(map).bindPopup(`<b>${p.name}</b>${p.notes?"<br>"+p.notes:""}`));});},[places,mapReady]);
  useEffect(()=>{if(!mapReady||!leafletRef.current)return;const map=leafletRef.current;const h=e=>{if(clicking)onAddPlace&&onAddPlace(e.latlng.lat,e.latlng.lng);};map.on("click",h);return()=>map.off("click",h);},[mapReady,clicking,onAddPlace]);
  return(<div><div ref={mapRef} style={{width:"100%",height:240,borderRadius:14,overflow:"hidden",border:`1.5px solid ${B.border}`}}/><div style={{marginTop:8}}><Btn small onClick={()=>setClicking(c=>!c)}>{clicking?"✓ Clicca sulla mappa...":"📍 Aggiungi luogo"}</Btn></div></div>);
}

function EditModal({item,fields,onSave,onClose,title}){
  const [data,setData]=useState({...item});
  const fd=(k,v)=>setData(p=>({...p,[k]:v}));
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",zIndex:200,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={onClose}>

        {fields.map(field=>{
          if(field.type==="select"){return(<div key={field.key} style={{marginBottom:10}}><label style={{fontSize:13,color:B.dark,display:"block",marginBottom:4,fontWeight:600}}>{field.label}</label><select value={data[field.key]||""} onChange={e=>fd(field.key,e.target.value)} style={{width:"100%",borderRadius:10,border:`1.5px solid ${B.border}`,padding:"9px 12px",background:"#f8fbff",fontSize:14}}>{field.options.map(o=><option key={o.val||o} value={o.val||o}>{o.label||o}</option>)}</select></div>);}
          if(field.type==="textarea"){return(<div key={field.key} style={{marginBottom:10}}><label style={{fontSize:13,color:B.dark,display:"block",marginBottom:4,fontWeight:600}}>{field.label}</label><textarea value={data[field.key]||""} onChange={e=>fd(field.key,e.target.value)} style={{width:"100%",minHeight:70,padding:"9px 12px",borderRadius:10,border:`1.5px solid ${B.border}`,background:"#f8fbff",fontSize:14,resize:"vertical"}}/></div>);}
          if(field.type==="range"){return(<div key={field.key} style={{marginBottom:10}}><label style={{fontSize:13,color:B.dark,display:"block",marginBottom:4,fontWeight:600}}>{field.label}</label><input type="range" min={field.min||1} max={field.max||5} step={1} value={data[field.key]||field.min||1} onChange={e=>fd(field.key,+e.target.value)} style={{width:"100%"}}/><span style={{fontSize:13}}>{moodEmoji[data[field.key]||3]} {moodLabel[data[field.key]||3]}</span></div>);}

    };

                            <button onClick={()=>delItem(setPhotos,p.id)} style={{fontSize:11,color:"#b91c1c",background:"none",border:"none",cursor:"pointer",padding:0}}>rimuovi</button>
                          </div>
                        </div>
                      </div>

                  </div>
                )}
              </div>
            ))}
          </div>

            <Card>
              <p style={{fontWeight:700,marginBottom:12,color:B.text}}>Aggiungi visita / vaccino</p>
              <Input label="Data" type="date" value={form.date||today()} onChange={e=>f("date",e.target.value)}/><Input label="Tipo" value={form.type||""} onChange={e=>f("type",e.target.value)} placeholder="es. visita, vaccino"/><Input label="Veterinario" value={form.vet||""} onChange={e=>f("vet",e.target.value)}/><Input label="Diagnosi / risultato" value={form.result||""} onChange={e=>f("result",e.target.value)}/><Input label="Prossimo appuntamento" type="date" value={form.next||""} onChange={e=>f("next",e.target.value)}/><Input label="Note" value={form.notes||""} onChange={e=>f("notes",e.target.value)}/>

            {[...vets].sort((a,b)=>b.date?.localeCompare(a.date||"")).map(v=>(
              <Card key={v.id}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div><p style={{fontWeight:700,margin:"0 0 3px",color:B.text}}>{v.type}</p><p style={{fontSize:13,color:"#64748b",margin:"0 0 5px"}}>{fmt(v.date)}{v.vet?` — ${v.vet}`:""}</p>{v.next&&<Tag color={v.next>=today()?"success":"secondary"}>Prossimo: {fmt(v.next)}</Tag>}{v.notes&&<p style={{fontSize:12,color:"#94a3b8",marginTop:6}}>{v.notes}</p>}</div>
                  <div style={{display:"flex",gap:4}}>

                    <button onClick={()=>setEditItem({setter:setSymptoms,item:s,title:"Modifica sintomo",fields:[{key:"date",label:"Data",type:"date"},{key:"symptom",label:"Sintomo"},{key:"severity",label:"Gravità",type:"select",options:[{val:"lieve",label:"Lieve"},{val:"moderata",label:"Moderata"},{val:"grave",label:"Grave"}]},{key:"notes",label:"Note",type:"textarea"}]})} style={{background:B.bg,border:`1px solid ${B.border}`,borderRadius:8,padding:"4px 8px",cursor:"pointer",fontSize:14}}>✏️</button>
                    <Btn small danger onClick={()=>delItem(setSymptoms,s.id)}>✕</Btn>
                  </div>
                </div>
              </Card>

          </div>

                      <p style={{fontWeight:700,margin:0,fontSize:14,color:"#854d0e"}}>{fr.name}</p>

                    <div style={{textAlign:"right"}}>
                      <p style={{fontWeight:800,fontSize:16,margin:0,color:"#92400e"}}>{score}</p>
                      <p style={{fontSize:10,color:"#92400e",margin:0}}>/100</p>

                  </div>);

              <Input label="Proprietario" value={form.owner||""} onChange={e=>f("owner",e.target.value)}/>
              <Input label="Quanti cani (es. 1 o 2 fratelli)" type="number" value={form.count||""} onChange={e=>f("count",e.target.value)} placeholder="es. 1"/>

                <label style={{fontSize:13,color:B.dark,display:"block",marginBottom:8,fontWeight:600}}>Reazione di Nemo</label>

                  {REACTION_OPTIONS.map(r=>(<label key={r.val} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:5,cursor:"pointer",padding:"11px 4px",borderRadius:12,border:`2px solid ${form.reaction===r.val?B.mid:B.border}`,background:form.reaction===r.val?B.bg:"white"}}><input type="radio" name="reaction" value={r.val} checked={form.reaction===r.val} onChange={()=>f("reaction",r.val)} style={{display:"none"}}/><span style={{fontSize:26}}>{r.label.split(" ")[0]}</span><span style={{fontSize:12,color:B.dark,fontWeight:600}}>{r.label.split(" ")[1]}</span></label>))}
                </div>
              </div>
              <div style={{marginBottom:14}}>
                <label style={{fontSize:13,color:B.dark,display:"block",marginBottom:8,fontWeight:700}}>Parametri affinità (0–20 ciascuno)</label>

                  <div key={p.id} style={{marginBottom:10}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                      <label style={{fontSize:13,color:B.dark,fontWeight:500}}>{p.label}</label>
                      <span style={{fontSize:13,fontWeight:700,color:B.mid}}>{form.affinity?.[p.id]||0}/20</span>
                    </div>
                    <input type="range" min={0} max={20} step={1} value={form.affinity?.[p.id]||0} onChange={e=>f("affinity",{...(form.affinity||{}),[p.id]:+e.target.value})} style={{width:"100%"}}/>
                  </div>
                ))}
                <div style={{background:B.bg,borderRadius:10,padding:"8px 12px",textAlign:"center"}}>
                  <span style={{fontWeight:800,fontSize:18,color:B.mid}}>{AFFINITY_PARAMS.reduce((s,p)=>s+(+(form.affinity?.[p.id]||0)),0)}</span>
                  <span style={{fontSize:13,color:B.dark}}>/100 — {affinityLabel(AFFINITY_PARAMS.reduce((s,p)=>s+(+(form.affinity?.[p.id]||0)),0)).label}</span>
                </div>
              </div>
              <div style={{marginBottom:10}}><label style={{fontSize:13,color:B.dark,display:"block",marginBottom:4,fontWeight:600}}>Note</label><textarea value={form.notes||""} onChange={e=>f("notes",e.target.value)} placeholder="es. Si calmano dopo 5 minuti..." style={{width:"100%",minHeight:60,padding:"9px 12px",borderRadius:10,border:`1.5px solid ${B.border}`,background:"#f8fbff",fontSize:14,resize:"vertical"}}/></div>
              <Input label="Data primo incontro" type="date" value={form.metDate||today()} onChange={e=>f("metDate",e.target.value)}/>
              <Btn accent onClick={()=>{if(!form.name)return;addItem(setFriends,{...form,reaction:form.reaction||"neutro",photo:form.friendPhoto||null});}}>+ Aggiungi amico</Btn>
            </Card>

            {friends.length===0&&<Empty msg="Nessun amico registrato"/>}
            {sortedFriends.map(fr=>{
              const score=affinityScore(fr);
              const lbl=affinityLabel(score);
              const rx=REACTION_OPTIONS.find(r=>r.val===fr.reaction)||REACTION_OPTIONS[1];
              return(
                <Card key={fr.id}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",alignItems:"center",gap:11,marginBottom:8}}>
                        {fr.photo?<img src={fr.photo} style={{width:50,height:50,borderRadius:"50%",objectFit:"cover",border:`2px solid ${B.border}`}}/>:<div style={{width:50,height:50,borderRadius:"50%",background:B.bg,border:`2px solid ${B.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>🐕</div>}
                        <div>
                          <p style={{fontWeight:700,margin:0,color:B.text}}>{fr.name}{fr.breed?` · ${fr.breed}`:""}</p>
                          {fr.owner&&<p style={{fontSize:13,color:"#64748b",margin:0}}>di {fr.owner}{fr.count&&fr.count>1?` · ${fr.count} cani`:""}</p>}
                        </div>
                      </div>
                      <div style={{marginBottom:8}}><Tag color={rx.color}>{rx.label}</Tag></div>
                      {/* Affinity bar */}
                      <div style={{background:lbl.bg,borderRadius:10,padding:"8px 12px",marginBottom:6}}>
                        <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                          <span style={{fontSize:12,fontWeight:700,color:lbl.color}}>{lbl.label}</span>
                          <span style={{fontSize:14,fontWeight:800,color:lbl.color}}>{score}/100</span>
                        </div>
                        <div style={{height:7,background:"rgba(0,0,0,0.1)",borderRadius:4,overflow:"hidden"}}><div style={{height:"100%",width:`${score}%`,background:lbl.color,borderRadius:4,transition:"width 0.4s"}}/></div>
                      </div>
                      {fr.notes&&<div style={{background:B.bg,borderRadius:10,padding:"8px 11px"}}><p style={{fontSize:13,color:B.dark,margin:0,fontStyle:"italic"}}>{fr.notes}</p></div>}
                    </div>
                    <div style={{display:"flex",gap:4,marginLeft:8}}>
                      <button onClick={()=>setEditItem({setter:setFriends,item:fr,title:"Modifica amico",fields:[{key:"name",label:"Nome"},{key:"breed",label:"Razza"},{key:"owner",label:"Proprietario"},{key:"count",label:"N° cani",type:"number"},{key:"reaction",label:"Reazione",type:"select",options:REACTION_OPTIONS.map(r=>({val:r.val,label:r.label}))},{key:"notes",label:"Note",type:"textarea"},{key:"metDate",label:"Data primo incontro",type:"date"}]})} style={{background:B.bg,border:`1px solid ${B.border}`,borderRadius:8,padding:"4px 8px",cursor:"pointer",fontSize:14}}>✏️</button>
                      <Btn small danger onClick={()=>delItem(setFriends,fr.id)}>✕</Btn>
                    </div>
                  </div>
                </Card>
              );
            })}
          </div>
        )}

        {/* GRAFICI */}
        {section==="charts"&&(
          <div>
            <Card><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><p style={{fontWeight:700,margin:0,color:B.text}}>Peso</p><Trend data={weightChart}/></div>{weights.length>=2?<LineChart data={weightChart} color={B.mid}/>:<Empty msg="Aggiungi almeno 2 pesate"/>}{weights.length>0&&(<div style={{display:"flex",gap:8,marginTop:12}}>{[{label:"Attuale",val:weights.sort((a,b)=>b.date?.localeCompare(a.date)).slice(-1)[0]?.kg+" kg"},{label:"Minimo",val:Math.min(...weights.map(w=>+w.kg))+" kg"},{label:"Massimo",val:Math.max(...weights.map(w=>+w.kg))+" kg"}].map(c=>(<div key={c.label} style={{flex:1,background:B.bg,borderRadius:10,padding:"9px",textAlign:"center"}}><p style={{fontSize:11,color:B.dark,margin:0,fontWeight:600}}>{c.label}</p><p style={{fontSize:16,fontWeight:800,margin:0,color:B.text}}>{c.val}</p></div>))}</div>)}</Card>
            <Card><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><p style={{fontWeight:700,margin:0,color:B.text}}>Solo a casa</p><Trend data={aloneChart}/></div>{alones.length>=2?<LineChart data={aloneChart} color="#1D9E75"/>:<Empty msg="Aggiungi almeno 2 sessioni"/>}</Card>
            <Card><p style={{fontWeight:700,margin:"0 0 10px",color:B.text}}>Passeggiate per mese</p>{walks.length>=2?<BarChart data={walksPerMonth()} color={B.mid}/>:<Empty msg="Aggiungi almeno 2 giri"/>}</Card>
            <Card><p style={{fontWeight:700,margin:"0 0 10px",color:B.text}}>Sintomi più frequenti</p>{symptoms.length>=2?<BarChart data={sympByType()} color="#E24B4A"/>:<Empty msg="Aggiungi almeno 2 sintomi"/>}{symptoms.length>0&&(<div style={{display:"flex",gap:8,marginTop:12}}>{[{label:"Gravi",val:symptoms.filter(s=>s.severity==="grave").length,bg:"#fee2e2",tc:"#b91c1c"},{label:"Moderati",val:symptoms.filter(s=>s.severity==="moderata").length,bg:"#fef9c3",tc:"#854d0e"},{label:"Lievi",val:symptoms.filter(s=>s.severity==="lieve").length,bg:"#dcfce7",tc:"#166534"}].map(c=>(<div key={c.label} style={{flex:1,background:c.bg,borderRadius:10,padding:"9px",textAlign:"center"}}><p style={{fontSize:11,color:c.tc,margin:0,fontWeight:600}}>{c.label}</p><p style={{fontSize:16,fontWeight:800,margin:0,color:c.tc}}>{c.val}</p></div>))}</div>)}</Card>
            {/* Affinity chart */}
            {friends.length>0&&(<Card><p style={{fontWeight:700,margin:"0 0 12px",color:B.text}}>🏆 Affinità amici</p>{sortedFriends.map(fr=>{const score=affinityScore(fr);const lbl=affinityLabel(score);return(<div key={fr.id} style={{marginBottom:10}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontSize:13,fontWeight:600,color:B.text}}>{fr.name}</span><span style={{fontSize:13,fontWeight:800,color:lbl.color}}>{score}/100</span></div><div style={{height:10,background:B.bg,borderRadius:5,overflow:"hidden"}}><div style={{height:"100%",width:`${score}%`,background:B.mid,borderRadius:5}}/></div></div>);})}</Card>)}
          </div>
        )}

      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
