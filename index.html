function compress(file,cb){const img=new Image(),r=new FileReader();r.onload=ev=>{img.onload=()=>{const c=document.createElement("canvas");const M=600;let w=img.width,h=img.height;if(w>h){if(w>M){h=Math.round(h*M/w);w=M;}}else if(h>M){w=Math.round(w*M/h);h=M;}c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);cb(c.toDataURL("image/jpeg",0.7));};img.src=ev.target.result;};r.readAsDataURL(file);}

function regSW(){
  if(!('serviceWorker'in navigator)||!('Notification'in window))return;
  const sw=`self.addEventListener('message',e=>{if(e.data&&e.data.type==='SCHED'){const{title,body,delay}=e.data;setTimeout(()=>self.registration.showNotification(title,{body,vibrate:[200,100,200]}),delay);}});`;
  const blob=new Blob([sw],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).then(r=>{window._sw=r;}).catch(()=>{});
}
function schedNotif(title,body,delay){if(Notification.permission==='granted'&&window._sw){window._sw.active?.postMessage({type:'SCHED',title,body,delay});}}
function schedMeds(meds){
  if(Notification.permission!=='granted')return;
  const now=new Date();
  meds.filter(m=>m.active&&m.reminderTime).forEach(m=>{
    const[hh,mm]=m.reminderTime.split(':').map(Number);
    const t=new Date(now);t.setHours(hh,mm,0,0);
    if(t<=now)t.setDate(t.getDate()+1);
    schedNotif(`💊 Farmaco per Nemo`,`${m.name} — ${m.dose}`,t-now);
  });
}
function schedVets(vets){
  if(Notification.permission!=='granted')return;
  const now=new Date();
  vets.filter(v=>v.next&&v.next>=today()).forEach(v=>{
    const t=new Date(v.next+"T09:00:00");
    const d1=new Date(t);d1.setDate(t.getDate()-1);
    const d2=new Date(t);d2.setDate(t.getDate()-2);
    if(d2>now)schedNotif("📅 Visita vet dopodomani",`${v.type}${v.vet?" da "+v.vet:""}`,d2-now);
    if(d1>now)schedNotif("📅 Visita vet domani",`${v.type}${v.vet?" da "+v.vet:""}`,d1-now);
  });
}

function LineChart({data,color="#378ADD"}){
  if(!data||data.length<2)return <Empty msg="Servono almeno 2 dati"/>;
  const W=500,H=120,P=32;
  const s=[...data].sort((a,b)=>(a.dk||"").localeCompare(b.dk||""));
  const vs=s.map(d=>d.val);const mx=Math.max(...vs),mn=Math.min(...vs),rng=mx-mn||1;
  const pts=s.map((d,i)=>({x:P+(i/(s.length-1))*(W-P*2),y:P+((mx-d.val)/rng)*(H-P*2),l:d.label}));
  const path=pts.map((p,i)=>`${i===0?"M":"L"} ${p.x} ${p.y}`).join(" ");
  const area=`${path} L ${pts[pts.length-1].x} ${H-8} L ${pts[0].x} ${H-8} Z`;
  return(<svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}}>{[0,1,2].map(i=>{const y=P+(i/2)*(H-P*1.5);return(<g key={i}><line x1={P} y1={y} x2={W-8} y2={y} stroke={B.border} strokeWidth="1"/><text x={P-4} y={y+4} fontSize="9" fill={B.dark} textAnchor="end">{(mx-(i/2)*rng).toFixed(1)}</text></g>);})} <path d={area} fill={color} fillOpacity="0.13"/><path d={path} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>{pts.map((p,i)=><g key={i}><circle cx={p.x} cy={p.y} r="5" fill="#fff" stroke={color} strokeWidth="2"/><text x={p.x} y={H} fontSize="9" fill={B.dark} textAnchor="middle">{p.l}</text></g>)}</svg>);
}
function BarChart({data,color="#378ADD"}){
  if(!data||data.length===0)return <Empty msg="Nessun dato"/>;
  const s=[...data].sort((a,b)=>(a.dk||"").localeCompare(b.dk||""));
  const W=500,H=110,P=28;const mx=Math.max(...s.map(d=>d.val),1);const bw=Math.min(38,(W-P*2)/s.length-6);
  return(<svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}}>{s.map((d,i)=>{const bh=(d.val/mx)*(H-P-10);const x=P+i*((W-P*2)/s.length)+((W-P*2)/s.length-bw)/2;const y=H-P-bh;return(<g key={i}><rect x={x} y={y} width={bw} height={bh} rx="5" fill={color} fillOpacity="0.75"/><text x={x+bw/2} y={y-3} fontSize="9" fill={B.dark} textAnchor="middle">{d.val}</text><text x={x+bw/2} y={H-2} fontSize="9" fill={B.dark} textAnchor="middle">{d.label}</text></g>);})} </svg>);
}
function Trend({data}){
  if(!data||data.length<2)return null;
  const s=[...data].sort((a,b)=>(a.dk||"").localeCompare(b.dk||""));
  const diff=s[s.length-1].val-s[s.length-2].val;
  if(diff===0)return<Tag color="secondary">= stabile</Tag>;
  return<Tag color={diff>0?"success":"danger"}>{diff>0?"↑ in aumento":"↓ in calo"}</Tag>;
}

function GroupedList({items,renderItem,emptyMsg}){
  const [mode,setMode]=useState("month");
  const [open,setOpen]=useState({});
  const groups=useMemo(()=>{
    const g={};
    [...items].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).forEach(item=>{
      let key=item.date||"";
      if(mode==="week"&&item.date){
        const dt=new Date(item.date+"T00:00:00");
        const mon=new Date(dt);mon.setDate(dt.getDate()-((dt.getDay()+6)%7));
        key=mon.toISOString().split("T")[0];
      } else if(mode==="month"&&item.date){key=item.date.slice(0,7);}
      if(!g[key])g[key]=[];g[key].push(item);
    });
    return g;
  },[items,mode]);
  const keys=Object.keys(groups);
  if(items.length===0)return<Empty msg={emptyMsg}/>;
  const lbl=(k)=>{
    if(!k)return"Senza data";
    if(mode==="month"){const d=new Date(k+"-01T00:00:00");return d.toLocaleDateString("it-IT",{month:"long",year:"numeric"});}
    const d=new Date(k+"T00:00:00");const e=new Date(d);e.setDate(d.getDate()+6);
    return`${d.toLocaleDateString("it-IT",{day:"numeric",month:"short"})} – ${e.toLocaleDateString("it-IT",{day:"numeric",month:"short"})}`;
  };
  return(<div>
    <div style={{display:"flex",gap:8,marginBottom:10}}>
      {["month","week"].map(m=>(<button key={m} onClick={()=>setMode(m)} style={{flex:1,padding:"7px",borderRadius:10,border:`1.5px solid ${mode===m?B.mid:B.border}`,background:mode===m?B.bg:"white",cursor:"pointer",fontSize:13,fontWeight:600,color:mode===m?B.dark:"#64748b"}}>{m==="month"?"Per mese":"Per settimana"}</button>))}
    </div>
    {keys.map((k,ki)=>{
      const isOpen=k in open?open[k]:ki===0;
      return(<div key={k}>
        <div onClick={()=>setOpen(p=>({...p,[k]:!isOpen}))} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 14px",background:GRAD,borderRadius:12,marginBottom:isOpen?8:10,cursor:"pointer",boxShadow:"0 2px 6px rgba(55,138,221,0.18)"}}>
          <p style={{fontWeight:700,fontSize:14,color:"white",margin:0,textTransform:"capitalize"}}>{lbl(k)}</p>
          <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{background:"rgba(255,255,255,0.25)",color:"white",fontSize:12,fontWeight:700,padding:"2px 8px",borderRadius:10}}>{groups[k].length}</span><span style={{color:"white",fontSize:14}}>{isOpen?"▲":"▼"}</span></div>
        </div>
        {isOpen&&<div style={{marginBottom:10}}>{groups[k].map(item=>renderItem(item))}</div>}
      </div>);
    })}
  </div>);
}

        if(field.type==="range")return(<div key={field.key} style={{marginBottom:10}}><label style={{fontSize:13,color:B.dark,display:"block",marginBottom:4,fontWeight:600}}>{field.label}</label><input type="range" min={field.min||1} max={field.max||5} step={1} value={data[field.key]||3} onChange={e=>fd(field.key,+e.target.value)} style={{width:"100%"}}/><span style={{fontSize:13}}>{ME[data[field.key]||3]} {ML[data[field.key]||3]}</span></div>);
        if(field.type==="checkboxes")return(<div key={field.key} style={{marginBottom:10}}><label style={{fontSize:13,color:B.dark,display:"block",marginBottom:6,fontWeight:600}}>{field.label}</label>{field.options.map(b=>(<label key={b.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",borderRadius:10,border:`1.5px solid ${(data[field.key]||[]).includes(b.id)?B.mid:B.border}`,background:(data[field.key]||[]).includes(b.id)?B.bg:"white",cursor:"pointer",fontSize:14,marginBottom:6}}><input type="checkbox" checked={(data[field.key]||[]).includes(b.id)} onChange={e=>{const c=data[field.key]||[];fd(field.key,e.target.checked?[...c,b.id]:c.filter(x=>x!==b.id));}}/>{b.label}</label>))}</div>);
        return(<div key={field.key} style={{marginBottom:10}}><label style={{fontSize:13,color:B.dark,display:"block",marginBottom:4,fontWeight:600}}>{field.label}</label><input type={field.type||"text"} value={data[field.key]||""} onChange={e=>fd(field.key,e.target.value)} placeholder={field.placeholder||""} style={{width:"100%",borderRadius:10,border:`1.5px solid ${B.border}`,padding:"9px 12px",fontSize:14,background:"#f8fbff",outline:"none"}}/></div>);
      })}
      <Btn accent onClick={()=>{onSave(data);onClose();}}>Salva modifiche</Btn>
    </div>
  </div>);
}

  const sc={appreso:{bg:"#dcfce7",text:"#166534",border:"#86efac"},"in corso":{bg:"#fef9c3",text:"#854d0e",border:"#fde047"},"da iniziare":{bg:"#f1f5f9",text:"#475569",border:"#cbd5e1"}}[t.status]||{bg:"#f1f5f9",text:"#475569",border:"#cbd5e1"};
  const diff="⭐".repeat(cmd.diff)+"☆".repeat(4-cmd.diff);

      </div>
      <div style={{display:"flex",alignItems:"center",gap:8}}>

        <span style={{color:B.dark,fontSize:14}}>{open?"▲":"▼"}</span>
      </div>
    </div>
    {open&&(<div style={{marginTop:12,borderTop:`1px solid ${B.border}`,paddingTop:12}}>
      <div style={{background:B.bg,borderRadius:10,padding:"10px 12px",marginBottom:12}}>
        <p style={{fontSize:12,fontWeight:700,color:B.dark,margin:"0 0 4px"}}>📖 Come insegnarlo</p>
        <p style={{fontSize:13,color:"#334155",margin:0,lineHeight:1.6}}>{cmd.come}</p>
      </div>
      <div style={{display:"flex",gap:6,marginBottom:12}}>

      </div>
      <div style={{background:"#f8fbff",borderRadius:10,padding:"12px"}}>
        <p style={{fontSize:12,fontWeight:700,color:B.dark,margin:"0 0 8px"}}>➕ Registra sessione</p>
        <Inp label="Data" type="date" value={form.date||today()} onChange={e=>f("date",e.target.value)}/>
        <div style={{marginBottom:8}}>
          <label style={{fontSize:12,color:B.dark,display:"block",marginBottom:4,fontWeight:600}}>Risultato</label>
          <div style={{display:"flex",gap:6}}>{["✅ Riuscito","🔄 Parziale","❌ Da rifare"].map(r=>(<button key={r} onClick={()=>f("result",r)} style={{flex:1,padding:"6px 4px",borderRadius:8,border:`1.5px solid ${form.result===r?B.mid:B.border}`,background:form.result===r?B.bg:"white",cursor:"pointer",fontSize:11,fontWeight:600}}>{r}</button>))}</div>
        </div>
        <Inp label="Note" value={form.notes||""} onChange={e=>f("notes",e.target.value)} placeholder="es. Ci vuole ancora il premio..."/>
        <Btn small accent onClick={()=>{setTrainSessions(p=>[{commandId:cmd.id,date:form.date||today(),result:form.result||"🔄 Parziale",notes:form.notes||"",id:Date.now()},...p]);setForm({});}}>Salva sessione</Btn>
      </div>
      {sessions.length>0&&(<div style={{marginTop:10}}>
        <p style={{fontSize:12,fontWeight:700,color:B.dark,margin:"0 0 6px"}}>📋 Ultime sessioni</p>
        {[...sessions].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,4).map(s=>(<div key={s.id} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderTop:`1px solid ${B.bg}`,fontSize:13}}><span style={{color:"#64748b"}}>{fmt(s.date)}</span><span style={{fontWeight:600}}>{s.result}</span></div>))}
      </div>)}
    </div>)}
  </Card>);
}

function WalkMap({places,onAddPlace}){
  const mr=useRef(null),lr=useRef(null),marks=useRef([]);
  const [ready,setReady]=useState(false),[click,setClick]=useState(false);
  useEffect(()=>{
    if(mr.current&&!lr.current){
      const lnk=document.createElement("link");lnk.rel="stylesheet";lnk.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";document.head.appendChild(lnk);
      const s=document.createElement("script");s.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
      s.onload=()=>setTimeout(()=>{const L=window.L,m=L.map(mr.current).setView([41.9,12.5],5);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(m);lr.current=m;setReady(true);if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>m.setView([p.coords.latitude,p.coords.longitude],14));},300);
      document.head.appendChild(s);}
  },[]);
  useEffect(()=>{if(!ready||!lr.current)return;const L=window.L,m=lr.current;marks.current.forEach(x=>x.remove());marks.current=[];places.forEach(p=>{const ic=L.divIcon({className:"",html:`<div style="background:${B.mid};color:white;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:15px;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.2)">${p.emoji||"📍"}</div>`,iconSize:[30,30],iconAnchor:[15,15]});marks.current.push(L.marker([p.lat,p.lng],{icon:ic}).addTo(m).bindPopup(`<b>${p.name}</b>${p.notes?"<br>"+p.notes:""}`));});},[places,ready]);
  useEffect(()=>{if(!ready||!lr.current)return;const m=lr.current;const h=e=>{if(click)onAddPlace&&onAddPlace(e.latlng.lat,e.latlng.lng);};m.on("click",h);return()=>m.off("click",h);},[ready,click,onAddPlace]);
  return(<div><div ref={mr} style={{width:"100%",height:240,borderRadius:14,overflow:"hidden",border:`1.5px solid ${B.border}`}}/><div style={{marginTop:8}}><Btn small onClick={()=>setClick(c=>!c)}>{click?"✓ Clicca mappa...":"📍 Aggiungi luogo"}</Btn></div></div>);
}

function LoadingScreen(){return(<div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"linear-gradient(160deg,#cce8ff,#f0f8ff)"}}><PawBg/><div style={{position:"relative",zIndex:1,textAlign:"center"}}><div style={{width:80,height:80,borderRadius:"50%",background:GRAD,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px",boxShadow:"0 8px 24px rgba(55,138,221,0.3)"}}><span style={{fontSize:38}}>🐾</span></div><p style={{fontWeight:800,fontSize:22,color:B.text,margin:"0 0 8px"}}>Nemo</p><p style={{fontSize:14,color:B.dark,opacity:0.7}}>Caricamento...</p></div></div>);}

export default function App(){

  const [friends,setFriends]=useState([]);
  const [places,setPlaces]=useState([]);
  const [training,setTraining]=useState([]);

  const saveOk=useRef(false);
  const timerRef=useRef(null);

  useEffect(()=>{regSW();setNotifOk(Notification?.permission==="granted");},[]);

  useEffect(()=>{
    const init=()=>{
      const setters={dog:setDog,dogPhoto:setDogPhoto,meds:setMeds,alones:setAlones,weights:setWeights,walks:setWalks,photos:setPhotos,vets:setVets,symptoms:setSymptoms,friends:setFriends,places:setPlaces,training:setTraining,trainSessions:setTrainSessions,walkGoals:setWalkGoals};
      let loaded={};
      const unsubs=ALL_KEYS.map(k=>fbListen(k,v=>{if(setters[k])setters[k](v);loaded[k]=true;if(ALL_KEYS.every(key=>loaded[key]))setTimeout(()=>{saveOk.current=true;setReady(true);},300);}));
      const t=setTimeout(()=>{saveOk.current=true;setReady(true);},4500);
      return()=>{unsubs.forEach(u=>u());clearTimeout(t);};
    };
    if(window._fbReady){const c=init();return c;}
    let c=null;const h=()=>{c=init();};
    window.addEventListener("firebase-ready",h);
    return()=>{window.removeEventListener("firebase-ready",h);c&&c();};
  },[]);

  useEffect(()=>{if(!saveOk.current)return;fbSave("dog",dog);},[dog]);
  useEffect(()=>{if(!saveOk.current)return;fbSave("dogPhoto",dogPhoto);},[dogPhoto]);
  useEffect(()=>{if(!saveOk.current)return;fbSave("meds",meds);if(notifOk)schedMeds(meds);},[meds]);
  useEffect(()=>{if(!saveOk.current)return;fbSave("alones",alones);},[alones]);
  useEffect(()=>{if(!saveOk.current)return;fbSave("weights",weights);},[weights]);
  useEffect(()=>{if(!saveOk.current)return;fbSave("walks",walks);},[walks]);
  useEffect(()=>{if(!saveOk.current)return;fbSave("photos",photos);},[photos]);

  useEffect(()=>{if(!saveOk.current)return;fbSave("places",places);},[places]);
  useEffect(()=>{if(!saveOk.current)return;fbSave("training",training);},[training]);
  useEffect(()=>{if(!saveOk.current)return;fbSave("trainSessions",trainSessions);},[trainSessions]);
  useEffect(()=>{if(!saveOk.current)return;fbSave("walkGoals",walkGoals);},[walkGoals]);

  // New-data notification
  useEffect(()=>{
    if(!ready)return;
    const last=parseInt(localStorage.getItem("nemo_seen")||"0");
    const all=[...alones,...walks,...photos,...vets,...symptoms,...trainSessions];
    const newer=all.filter(x=>x.id&&x.id>last+30000);

    localStorage.setItem("nemo_seen",String(Date.now()));

    timerRef.current=setInterval(check,30000);check();return()=>clearInterval(timerRef.current);

              <p style={{fontSize:13,margin:0,color:"rgba(255,255,255,0.8)",fontWeight:500}}>🏠 Kika & Rubi{dog.breed?` · ${dog.breed}`:""}</p>
            </div>
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",padding:"12px 14px"}}>
            {[{label:"Chip",val:(dog.chip||"—").slice(0,12)},{label:"Farmaci",val:meds.filter(m=>m.active).length+"💊"},{label:"Peso",val:latestW?latestW.kg+"kg":"—"},{label:"Visita",val:vets.find(v=>v.next&&v.next>=today())?.next?fmt(vets.find(v=>v.next&&v.next>=today()).next).slice(0,8):"—"}].map(c=>(<div key={c.label} style={{background:"rgba(255,255,255,0.14)",borderRadius:10,padding:"5px 10px"}}><p style={{fontSize:9,color:"rgba(255,255,255,0.6)",margin:"0 0 1px",textTransform:"uppercase",letterSpacing:"0.5px",fontWeight:600}}>{c.label}</p><p style={{fontSize:13,fontWeight:700,color:"white",margin:0,whiteSpace:"nowrap"}}>{c.val}</p></div>))}

          {[{label:"Amici",val:friends.length,color:"#378ADD",bg:"linear-gradient(135deg,#e8f4fd,#dbeeff)"},{label:"Giri",val:walks.length,color:"#1D9E75",bg:"linear-gradient(135deg,#dcfce7,#bbf7d0)"},{label:"Foto",val:photos.length,color:"#7C3AED",bg:"linear-gradient(135deg,#ede9fe,#ddd6fe)"}].map(c=>(<div key={c.label} style={{background:c.bg,borderRadius:16,padding:"14px 10px",textAlign:"center",border:"1px solid rgba(255,255,255,0.8)"}}><p style={{fontSize:26,fontWeight:900,margin:"0 0 3px",color:c.color}}>{c.val}</p><p style={{fontSize:12,color:c.color,margin:0,fontWeight:600,opacity:0.8}}>{c.label}</p></div>))}
        </div>
        {randomPhoto?(<div style={{borderRadius:20,overflow:"hidden",marginBottom:16,boxShadow:"0 6px 20px rgba(55,138,221,0.15)",position:"relative"}}><img src={randomPhoto.photoData} style={{width:"100%",height:200,objectFit:"cover",display:"block"}}/><div style={{position:"absolute",inset:0,background:"linear-gradient(to bottom,transparent 40%,rgba(10,20,60,0.75) 100%)"}}/><div style={{position:"absolute",top:12,left:14}}><span style={{background:"rgba(255,255,255,0.2)",backdropFilter:"blur(8px)",color:"white",fontSize:11,fontWeight:700,padding:"4px 10px",borderRadius:20,border:"1px solid rgba(255,255,255,0.3)",textTransform:"uppercase",letterSpacing:"0.8px"}}>✨ Ricordo</span></div><div style={{position:"absolute",bottom:0,left:0,right:0,padding:"14px 16px"}}>{randomPhoto.caption&&<p style={{fontWeight:700,fontSize:15,color:"white",margin:"0 0 3px",textShadow:"0 1px 4px rgba(0,0,0,0.4)"}}>{randomPhoto.caption}</p>}<p style={{fontSize:12,color:"rgba(255,255,255,0.75)",margin:0}}>{fmt(randomPhoto.date)}{randomPhoto.place?` · 📍 ${randomPhoto.place}`:""}</p></div></div>):(<div onClick={()=>goTo("photos")} style={{borderRadius:20,padding:"20px",background:"linear-gradient(135deg,#ede9fe,#ddd6fe)",border:"2px dashed #a78bfa",textAlign:"center",cursor:"pointer",marginBottom:16}}><p style={{fontSize:28,margin:"0 0 6px"}}>📸</p><p style={{fontSize:14,color:"#7C3AED",fontWeight:600,margin:0}}>Aggiungi le prime foto di Nemo</p></div>)}
      </div>)}

      {/* ===== SETTINGS ===== */}
      {isSection("settings")&&(<div>
        <Card><p style={{fontWeight:700,fontSize:13,color:B.dark,margin:"0 0 14px",textTransform:"uppercase",letterSpacing:"0.8px"}}>Modifica profilo</p><Inp label="Nome" value={dog.name} onChange={e=>setDog(p=>({...p,name:e.target.value}))} placeholder="es. Nemo"/><Inp label="Razza" value={dog.breed} onChange={e=>setDog(p=>({...p,breed:e.target.value}))} placeholder="es. Labrador"/><Inp label="Data di nascita" type="date" value={dog.dob} onChange={e=>setDog(p=>({...p,dob:e.target.value}))}/><Inp label="Numero chip" value={dog.chip} onChange={e=>setDog(p=>({...p,chip:e.target.value}))}/><Btn accent onClick={()=>dogRef.current?.click()}>📷 Cambia foto</Btn><p style={{fontSize:12,color:"#94a3b8",marginTop:6}}>Salvato automaticamente ☁️</p></Card>
        <Card><p style={{fontWeight:700,fontSize:13,color:B.dark,margin:"0 0 10px",textTransform:"uppercase",letterSpacing:"0.8px"}}>🔔 Notifiche</p>{notifOk?(<div style={{display:"flex",alignItems:"center",gap:10}}><span style={{fontSize:20}}>✅</span><div><p style={{fontWeight:600,margin:0,color:"#166534"}}>Notifiche attive</p><p style={{fontSize:12,color:"#64748b",margin:0}}>Farmaci, visite vet e aggiornamenti</p></div></div>):(<div><p style={{fontSize:14,color:"#64748b",marginBottom:10}}>Attiva le notifiche per ricevere promemoria farmaci, visite e aggiornamenti da Kika & Rubi.</p><Btn accent onClick={enableNotifs}>🔔 Attiva notifiche</Btn></div>)}</Card>
      </div>)}

      {/* ===== FARMACI ===== */}

          <p style={{fontWeight:700,marginBottom:12,color:B.text}}>Aggiungi farmaco</p>
          <Inp label="Nome" value={form.name||""} onChange={e=>f("name",e.target.value)} placeholder="es. Antibiotico"/><Inp label="Dose" value={form.dose||""} onChange={e=>f("dose",e.target.value)} placeholder="es. 1 compressa"/><Inp label="Frequenza" value={form.freq||""} onChange={e=>f("freq",e.target.value)} placeholder="es. 2 volte al giorno"/><Inp label="Inizio" type="date" value={form.start||today()} onChange={e=>f("start",e.target.value)}/><Inp label="Fine (opzionale)" type="date" value={form.end||""} onChange={e=>f("end",e.target.value)}/>
          <div style={{marginBottom:10}}><label style={{fontSize:13,color:B.dark,display:"block",marginBottom:4,fontWeight:600}}>⏰ Orario reminder</label><input type="time" value={form.reminderTime||""} onChange={e=>f("reminderTime",e.target.value)} style={{width:"100%",borderRadius:10,border:`1.5px solid ${B.border}`,padding:"9px 12px",fontSize:14,background:"#f8fbff"}}/></div>
          <Inp label="Note" value={form.notes||""} onChange={e=>f("notes",e.target.value)}/>
          <Btn accent onClick={()=>{if(!form.name)return;add(setMeds,{...form,active:true,date:today()});}}>+ Aggiungi</Btn>
        </Card>
        {!notifOk&&(<div style={{background:"#fef9c3",border:"1px solid #fde047",borderRadius:12,padding:"10px 14px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:13,color:"#854d0e"}}>Attiva le notifiche per il reminder</span><Btn small onClick={enableNotifs}>Attiva</Btn></div>)}
        {meds.length===0&&<Empty msg="Nessun farmaco registrato"/>}
        {meds.map(m=>(<Card key={m.id}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div style={{flex:1}}><p style={{fontWeight:700,margin:"0 0 4px",color:B.text}}>{m.name}</p><p style={{fontSize:13,color:"#64748b",margin:"0 0 6px"}}>{m.dose} — {m.freq}</p>{m.reminderTime&&<Tag color="warning">⏰ {m.reminderTime}</Tag>}<Tag color={m.active?"success":"secondary"}>{m.active?"Attivo":"Finito"}</Tag></div>
            <div style={{display:"flex",gap:4}}><Pen onClick={()=>setEditItem({setter:setMeds,item:m,title:"Modifica farmaco",fields:[{key:"name",label:"Nome"},{key:"dose",label:"Dose"},{key:"freq",label:"Frequenza"},{key:"start",label:"Inizio",type:"date"},{key:"end",label:"Fine",type:"date"},{key:"reminderTime",label:"Reminder",type:"time"},{key:"notes",label:"Note"}]})}/><Btn small danger onClick={()=>del(setMeds,m.id)}>✕</Btn></div>
          </div>
          <Btn small onClick={()=>setMeds(p=>p.map(x=>x.id===m.id?{...x,active:!x.active}:x))}>{m.active?"Segna finito":"Riattiva"}</Btn>
        </Card>))}
      </div>)}

      {/* ===== SOLO A CASA ===== */}
      {isSection("alone")&&(<div>
        <Card>
          <p style={{fontWeight:700,marginBottom:12,color:B.text}}>Nuova sessione</p>
          <Inp label="Data" type="date" value={form.date||today()} onChange={e=>f("date",e.target.value)}/>
          <div style={{marginBottom:12}}><label style={{fontSize:13,color:B.dark,display:"block",marginBottom:8,fontWeight:600}}>Fascia oraria</label><div style={{display:"flex",gap:8}}>{FASCIA.map(fas=>(<button key={fas} onClick={()=>f("fascia",fas)} style={{flex:1,padding:"9px 6px",borderRadius:12,border:`2px solid ${form.fascia===fas?B.mid:B.border}`,background:form.fascia===fas?B.bg:"white",cursor:"pointer",fontSize:13,fontWeight:600,color:form.fascia===fas?B.dark:"#64748b"}}>{fas}</button>))}</div></div>
          <Inp label="Durata (minuti)" type="number" value={form.mins||""} onChange={e=>f("mins",e.target.value)} placeholder="es. 90"/>
          <div style={{marginBottom:14}}>
            <label style={{fontSize:13,color:B.dark,display:"block",marginBottom:8,fontWeight:600}}>Comportamenti <span style={{fontSize:11,color:"#94a3b8",fontWeight:400}}>(peso nel punteggio)</span></label>
            <div style={{display:"flex",flexDirection:"column",gap:7}}>
              {BEHAVIORS.map(b=>{const sel=(form.behaviors||[]).includes(b.id);return(<label key={b.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 13px",borderRadius:12,border:`1.5px solid ${sel?B.mid:B.border}`,background:sel?B.bg:"white",cursor:"pointer",fontSize:14,fontWeight:500}}>
                <input type="checkbox" checked={sel} onChange={e=>{const c=form.behaviors||[];f("behaviors",e.target.checked?[...c,b.id]:c.filter(x=>x!==b.id));}}/>
                <span style={{flex:1}}>{b.label}</span>
                <span style={{fontSize:11,fontWeight:700,color:b.pts>0?"#166534":"#b91c1c",background:b.pts>0?"#dcfce7":"#fee2e2",padding:"2px 7px",borderRadius:10}}>{b.pts>0?"+":""}{b.pts}</span>
              </label>);})}
            </div>
            {(form.behaviors||[]).length>0&&(()=>{const sc=bScore(form.behaviors);const lb=bLabel(sc);return(<div style={{marginTop:10,background:lb.bg,borderRadius:12,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontWeight:700,color:lb.color}}>{lb.label}</span><span style={{fontWeight:800,fontSize:20,color:lb.color}}>{sc>0?"+":""}{sc} pt</span></div>);})()}
          </div>
          <div style={{marginBottom:12}}><label style={{fontSize:13,color:B.dark,display:"block",marginBottom:4,fontWeight:600}}>Note</label><textarea value={form.notes||""} onChange={e=>f("notes",e.target.value)} style={{width:"100%",minHeight:70,padding:"9px 12px",borderRadius:10,border:`1.5px solid ${B.border}`,background:"#f8fbff",fontSize:14,resize:"vertical"}}/></div>
          <Btn accent onClick={()=>add(setAlones,{...form,behaviors:form.behaviors||[]})}>+ Salva sessione</Btn>
        </Card>
        {alones.length>0&&(<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:14}}>{[{label:"Media",val:(alones.reduce((s,a)=>s+bScore(a.behaviors||[]),0)/alones.length).toFixed(1)+" pt"},{label:"Sessioni",val:alones.length},{label:"Min totali",val:alones.reduce((s,a)=>s+(+(a.mins||0)),0)}].map(c=>(<div key={c.label} style={{background:"rgba(255,255,255,0.9)",borderRadius:12,padding:"0.8rem",textAlign:"center",border:`1px solid ${B.border}`}}><p style={{fontSize:11,color:B.dark,margin:"0 0 3px",fontWeight:600}}>{c.label}</p><p style={{fontSize:18,fontWeight:800,margin:0,color:B.text}}>{c.val}</p></div>))}</div>)}
        <GroupedList items={alones} emptyMsg="Nessuna sessione" renderItem={a=>{const sc=bScore(a.behaviors||[]);const lb=bLabel(sc);return(<Card key={a.id}><div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}><div style={{flex:1}}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:7,flexWrap:"wrap"}}><p style={{fontWeight:700,margin:0,color:B.text}}>{fmt(a.date)}</p>{a.fascia&&<Tag color="info">{a.fascia}</Tag>}{a.mins&&<Tag color="secondary">⏱ {a.mins} min</Tag>}<span style={{fontSize:11,fontWeight:700,color:lb.color,background:lb.bg,padding:"2px 9px",borderRadius:10}}>{lb.label} ({sc>0?"+":""}{sc})</span></div>{a.behaviors&&a.behaviors.length>0&&<div style={{marginBottom:6}}>{a.behaviors.map(bid=>{const b=BEHAVIORS.find(x=>x.id===bid);return b?<Tag key={bid} color={b.pts>0?"success":"danger"}>{b.label.split(" ").slice(1).join(" ")}</Tag>:null;})}</div>}{a.notes&&<div style={{background:B.bg,borderRadius:10,padding:"8px 11px"}}><p style={{fontSize:13,color:B.dark,margin:0,fontStyle:"italic"}}>{a.notes}</p></div>}</div><div style={{display:"flex",gap:4,marginLeft:8}}><Pen onClick={()=>setEditItem({setter:setAlones,item:a,title:"Modifica sessione",fields:[{key:"date",label:"Data",type:"date"},{key:"fascia",label:"Fascia",type:"select",options:FASCIA.map(o=>({val:o,label:o}))},{key:"mins",label:"Durata (min)",type:"number"},{key:"behaviors",label:"Comportamenti",type:"checkboxes",options:BEHAVIORS},{key:"notes",label:"Note",type:"textarea"}]})}/><Btn small danger onClick={()=>del(setAlones,a.id)}>✕</Btn></div></div></Card>);}}/>
      </div>)}

      {/* ===== SALUTE HUB ===== */}
      {isSection("salute")&&(<div>
        {[
          {id:"weight",emoji:"⚖️",title:"Peso",desc:"Registra e monitora il peso",color:"#378ADD",bg:"linear-gradient(135deg,#e8f4fd,#dbeeff)",val:latestW?latestW.kg+" kg":"—"},
          {id:"vet",emoji:"💉",title:"Veterinario",desc:"Visite, vaccini e appuntamenti",color:"#1D9E75",bg:"linear-gradient(135deg,#dcfce7,#bbf7d0)",val:vets.find(v=>v.next&&v.next>=today())?fmt(vets.find(v=>v.next&&v.next>=today()).next):"Nessuna"},
          {id:"symptoms",emoji:"🩺",title:"Sintomi",desc:"Anomalie e sintomi da monitorare",color:"#E24B4A",bg:"linear-gradient(135deg,#fee2e2,#fecaca)",val:symptoms.filter(s=>s.severity==="grave").length>0?`⚠️ ${symptoms.filter(s=>s.severity==="grave").length} gravi`:`${symptoms.length} registrati`},
        ].map(s=>(<div key={s.id} onClick={()=>goSub(s.id)} style={{background:s.bg,borderRadius:20,padding:"18px 20px",marginBottom:12,cursor:"pointer",border:"1px solid rgba(255,255,255,0.8)",boxShadow:"0 3px 12px rgba(0,0,0,0.06)",display:"flex",alignItems:"center",gap:16}}>
          <div style={{width:56,height:56,borderRadius:16,background:"rgba(255,255,255,0.6)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,flexShrink:0}}>{s.emoji}</div>
          <div style={{flex:1}}><p style={{fontWeight:800,fontSize:17,margin:"0 0 3px",color:s.color}}>{s.title}</p><p style={{fontSize:13,color:"#64748b",margin:"0 0 5px"}}>{s.desc}</p><span style={{fontSize:12,fontWeight:700,color:s.color,background:"rgba(255,255,255,0.7)",padding:"2px 10px",borderRadius:10}}>{s.val}</span></div>
          <span style={{fontSize:20,color:s.color,opacity:0.5}}>›</span>
        </div>))}
      </div>)}

      {/* PESO */}
      {isSub("salute","weight")&&(<div>
        <BackBtn onClick={()=>goSub(null)} label="← Salute"/>
        <Card><p style={{fontWeight:700,marginBottom:12,color:B.text}}>Registra peso</p><Inp label="Data" type="date" value={form.date||today()} onChange={e=>f("date",e.target.value)}/><Inp label="Peso (kg)" type="number" step="0.1" value={form.kg||""} onChange={e=>f("kg",e.target.value)} placeholder="es. 12.5"/><Inp label="Note" value={form.notes||""} onChange={e=>f("notes",e.target.value)}/><Btn accent onClick={()=>{if(!form.kg)return;add(setWeights,form);}}>+ Aggiungi</Btn></Card>
        {wChart.length>=2&&<Card><p style={{fontWeight:700,marginBottom:10,color:B.text}}>Andamento</p><LineChart data={wChart} color={B.mid}/>{latestW&&<p style={{fontSize:13,color:B.dark,marginTop:6,textAlign:"right"}}>Attuale: <strong>{latestW.kg} kg</strong> ({fmt(latestW.date)})</p>}</Card>}
        <GroupedList items={weightsSorted.slice().reverse()} emptyMsg="Nessun peso" renderItem={w=>(<Card key={w.id}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><p style={{fontWeight:700,margin:"0 0 2px",color:B.text}}>{w.kg} kg</p><p style={{fontSize:13,color:"#64748b",margin:0}}>{fmt(w.date)}</p></div><div style={{display:"flex",gap:4}}><Pen onClick={()=>setEditItem({setter:setWeights,item:w,title:"Modifica peso",fields:[{key:"date",label:"Data",type:"date"},{key:"kg",label:"Peso",type:"number"},{key:"notes",label:"Note"}]})}/><Btn small danger onClick={()=>del(setWeights,w.id)}>✕</Btn></div></div></Card>)}/>
      </div>)}

      {/* VET */}
      {isSub("salute","vet")&&(<div>
        <BackBtn onClick={()=>goSub(null)} label="← Salute"/>
        {vets.filter(v=>v.next&&v.next>=today()).length>0&&(<Card style={{background:"linear-gradient(135deg,#f0fdf4,#dcfce7)",border:"1px solid #86efac"}}><p style={{fontWeight:700,margin:"0 0 10px",color:"#166534"}}>📅 Prossimi</p>{vets.filter(v=>v.next&&v.next>=today()).sort((a,b)=>a.next.localeCompare(b.next)).map(v=>(<div key={v.id} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderTop:"1px solid #bbf7d0",fontSize:13,color:"#166534"}}><span style={{fontWeight:500}}>{v.type}{v.vet?` — ${v.vet}`:""}</span><span style={{fontWeight:700}}>{fmt(v.next)}</span></div>))}</Card>)}
        <Card><p style={{fontWeight:700,marginBottom:12,color:B.text}}>Aggiungi visita</p><Inp label="Data" type="date" value={form.date||today()} onChange={e=>f("date",e.target.value)}/><Inp label="Tipo" value={form.type||""} onChange={e=>f("type",e.target.value)} placeholder="es. visita, vaccino"/><Inp label="Veterinario" value={form.vet||""} onChange={e=>f("vet",e.target.value)}/><Inp label="Diagnosi / risultato" value={form.result||""} onChange={e=>f("result",e.target.value)}/><Inp label="Prossimo appuntamento" type="date" value={form.next||""} onChange={e=>f("next",e.target.value)}/><Inp label="Note" value={form.notes||""} onChange={e=>f("notes",e.target.value)}/><Btn accent onClick={()=>{if(!form.type)return;add(setVets,form);}}>+ Aggiungi</Btn></Card>
        <GroupedList items={vets} emptyMsg="Nessuna visita" renderItem={v=>(<Card key={v.id}><div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}><div><p style={{fontWeight:700,margin:"0 0 3px",color:B.text}}>{v.type}</p><p style={{fontSize:13,color:"#64748b",margin:"0 0 5px"}}>{fmt(v.date)}{v.vet?` — ${v.vet}`:""}</p>{v.next&&<Tag color={v.next>=today()?"success":"secondary"}>Prossimo: {fmt(v.next)}</Tag>}{v.notes&&<p style={{fontSize:12,color:"#94a3b8",marginTop:6}}>{v.notes}</p>}</div><div style={{display:"flex",gap:4}}><Pen onClick={()=>setEditItem({setter:setVets,item:v,title:"Modifica visita",fields:[{key:"date",label:"Data",type:"date"},{key:"type",label:"Tipo"},{key:"vet",label:"Veterinario"},{key:"result",label:"Risultato"},{key:"next",label:"Prossimo",type:"date"},{key:"notes",label:"Note",type:"textarea"}]})}/><Btn small danger onClick={()=>del(setVets,v.id)}>✕</Btn></div></div></Card>)}/>
      </div>)}

      {/* SINTOMI */}
      {isSub("salute","symptoms")&&(<div>
        <BackBtn onClick={()=>goSub(null)} label="← Salute"/>
        <Card><p style={{fontWeight:700,marginBottom:12,color:B.text}}>Registra sintomo</p><Inp label="Data" type="date" value={form.date||today()} onChange={e=>f("date",e.target.value)}/><Inp label="Sintomo" value={form.symptom||""} onChange={e=>f("symptom",e.target.value)} placeholder="es. vomito, zoppia..."/><div style={{marginBottom:10}}><label style={{fontSize:13,color:B.dark,display:"block",marginBottom:4,fontWeight:600}}>Gravità</label><select value={form.severity||"lieve"} onChange={e=>f("severity",e.target.value)} style={{width:"100%",borderRadius:10,border:`1.5px solid ${B.border}`,padding:"9px 12px",background:"#f8fbff",fontSize:14}}><option value="lieve">Lieve</option><option value="moderata">Moderata</option><option value="grave">Grave</option></select></div><Inp label="Note" value={form.notes||""} onChange={e=>f("notes",e.target.value)}/><Btn accent onClick={()=>{if(!form.symptom)return;add(setSymptoms,{...form,severity:form.severity||"lieve"});}}>+ Aggiungi</Btn></Card>
        <GroupedList items={symptoms} emptyMsg="Nessun sintomo" renderItem={s=>(<Card key={s.id}><div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}><div><p style={{fontWeight:700,margin:"0 0 4px",color:B.text}}>{s.symptom}</p><p style={{fontSize:13,color:"#64748b",margin:"0 0 5px"}}>{fmt(s.date)}</p><Tag color={s.severity==="grave"?"danger":s.severity==="moderata"?"warning":"success"}>{s.severity==="grave"?"Grave":s.severity==="moderata"?"Moderata":"Lieve"}</Tag></div><div style={{display:"flex",gap:4}}><Pen onClick={()=>setEditItem({setter:setSymptoms,item:s,title:"Modifica sintomo",fields:[{key:"date",label:"Data",type:"date"},{key:"symptom",label:"Sintomo"},{key:"severity",label:"Gravità",type:"select",options:[{val:"lieve",label:"Lieve"},{val:"moderata",label:"Moderata"},{val:"grave",label:"Grave"}]},{key:"notes",label:"Note",type:"textarea"}]})}/><Btn small danger onClick={()=>del(setSymptoms,s.id)}>✕</Btn></div></div></Card>)}/>
      </div>)}

      {/* ===== PASSEGGIATE ===== */}
      {isSection("walks")&&(<div>

            <div style={{background:B.bg,borderRadius:10,padding:"8px 12px",textAlign:"center"}}><span style={{fontWeight:800,fontSize:18,color:B.mid}}>{AFFINITY.reduce((s,p)=>s+(+(form.affinity?.[p.id]||0)),0)}</span><span style={{fontSize:13,color:B.dark}}>/100 — {aLabel(AFFINITY.reduce((s,p)=>s+(+(form.affinity?.[p.id]||0)),0)).label}</span></div>
          </div>
          <div style={{marginBottom:10}}><label style={{fontSize:13,color:B.dark,display:"block",marginBottom:4,fontWeight:600}}>Note</label><textarea value={form.notes||""} onChange={e=>f("notes",e.target.value)} style={{width:"100%",minHeight:60,padding:"9px 12px",borderRadius:10,border:`1.5px solid ${B.border}`,background:"#f8fbff",fontSize:14,resize:"vertical"}}/></div>
          <Inp label="Data primo incontro" type="date" value={form.metDate||today()} onChange={e=>f("metDate",e.target.value)}/>
          <Btn accent onClick={()=>{if(!form.name)return;add(setFriends,{...form,reaction:form.reaction||"neutro",photo:form.friendPhoto||null});}}>+ Aggiungi</Btn>
        </Card>
        {friends.length===0&&<Empty msg="Nessun amico"/>}
        {sortedFriends.map(fr=>{const sc=aScore(fr);const lb=aLabel(sc);const rx=REACT.find(r=>r.val===fr.reaction)||REACT[1];return(<Card key={fr.id}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:11,marginBottom:8}}>{fr.photo?<img src={fr.photo} style={{width:50,height:50,borderRadius:"50%",objectFit:"cover",border:`2px solid ${B.border}`}}/>:<div style={{width:50,height:50,borderRadius:"50%",background:B.bg,border:`2px solid ${B.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>🐕</div>}<div><p style={{fontWeight:700,margin:0,color:B.text}}>{fr.name}{fr.breed?` · ${fr.breed}`:""}</p>{fr.owner&&<p style={{fontSize:13,color:"#64748b",margin:0}}>di {fr.owner}{fr.count&&fr.count>1?` · ${fr.count} cani`:""}</p>}</div></div>
              <div style={{marginBottom:8}}><Tag color={rx.color}>{rx.label}</Tag></div>
              <div style={{background:lb.bg,borderRadius:10,padding:"8px 12px",marginBottom:6}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontSize:12,fontWeight:700,color:lb.color}}>{lb.label}</span><span style={{fontSize:14,fontWeight:800,color:lb.color}}>{sc}/100</span></div><div style={{height:7,background:"rgba(0,0,0,0.1)",borderRadius:4,overflow:"hidden"}}><div style={{height:"100%",width:`${sc}%`,background:lb.color,borderRadius:4}}/></div></div>
              {fr.notes&&<div style={{background:B.bg,borderRadius:10,padding:"8px 11px"}}><p style={{fontSize:13,color:B.dark,margin:0,fontStyle:"italic"}}>{fr.notes}</p></div>}
            </div>
            <div style={{display:"flex",gap:4,marginLeft:8}}><Pen onClick={()=>setEditItem({setter:setFriends,item:fr,title:"Modifica amico",fields:[{key:"name",label:"Nome"},{key:"breed",label:"Razza"},{key:"owner",label:"Proprietario"},{key:"count",label:"N° cani",type:"number"},{key:"reaction",label:"Reazione",type:"select",options:REACT.map(r=>({val:r.val,label:r.label}))},{key:"notes",label:"Note",type:"textarea"},{key:"metDate",label:"Data incontro",type:"date"}]})}/><Btn small danger onClick={()=>del(setFriends,fr.id)}>✕</Btn></div>
          </div>
        </Card>);})}
      </div>)}

      {/* ===== GRAFICI ===== */}
      {isSection("charts")&&(<div>
        <Card><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><p style={{fontWeight:700,margin:0,color:B.text}}>Peso</p><Trend data={wChart}/></div>{wChart.length>=2?<LineChart data={wChart} color={B.mid}/>:<Empty msg="Aggiungi almeno 2 pesate"/>}{weights.length>0&&(<div style={{display:"flex",gap:8,marginTop:12}}>{[{label:"Attuale",val:latestW?.kg+" kg"},{label:"Minimo",val:Math.min(...weights.map(w=>+w.kg))+" kg"},{label:"Massimo",val:Math.max(...weights.map(w=>+w.kg))+" kg"}].map(c=>(<div key={c.label} style={{flex:1,background:B.bg,borderRadius:10,padding:"9px",textAlign:"center"}}><p style={{fontSize:11,color:B.dark,margin:0,fontWeight:600}}>{c.label}</p><p style={{fontSize:16,fontWeight:800,margin:0,color:B.text}}>{c.val}</p></div>))}</div>)}</Card>
        <Card><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><p style={{fontWeight:700,margin:0,color:B.text}}>Solo a casa</p><Trend data={aChart}/></div>{aChart.length>=2?<LineChart data={aChart} color="#1D9E75}"/>:<Empty msg="Aggiungi almeno 2 sessioni"/>}</Card>
        <Card><p style={{fontWeight:700,margin:"0 0 10px",color:B.text}}>Passeggiate/mese</p>{walks.length>=2?<BarChart data={wpm()} color={B.mid}/>:<Empty msg="Aggiungi almeno 2 giri"/>}</Card>
        <Card><p style={{fontWeight:700,margin:"0 0 10px",color:B.text}}>Sintomi frequenti</p>{symptoms.length>=2?<BarChart data={sbt()} color="#E24B4A"/>:<Empty msg="Aggiungi almeno 2 sintomi"/>}{symptoms.length>0&&(<div style={{display:"flex",gap:8,marginTop:12}}>{[{label:"Gravi",val:symptoms.filter(s=>s.severity==="grave").length,bg:"#fee2e2",tc:"#b91c1c"},{label:"Moderati",val:symptoms.filter(s=>s.severity==="moderata").length,bg:"#fef9c3",tc:"#854d0e"},{label:"Lievi",val:symptoms.filter(s=>s.severity==="lieve").length,bg:"#dcfce7",tc:"#166534"}].map(c=>(<div key={c.label} style={{flex:1,background:c.bg,borderRadius:10,padding:"9px",textAlign:"center"}}><p style={{fontSize:11,color:c.tc,margin:0,fontWeight:600}}>{c.label}</p><p style={{fontSize:16,fontWeight:800,margin:0,color:c.tc}}>{c.val}</p></div>))}</div>)}</Card>
        {friends.length>0&&(<Card><p style={{fontWeight:700,margin:"0 0 12px",color:B.text}}>🏆 Affinità amici</p>{sortedFriends.map(fr=>{const sc=aScore(fr);const lb=aLabel(sc);return(<div key={fr.id} style={{marginBottom:10}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontSize:13,fontWeight:600,color:B.text}}>{fr.name}</span><span style={{fontSize:13,fontWeight:800,color:lb.color}}>{sc}/100</span></div><div style={{height:10,background:B.bg,borderRadius:5,overflow:"hidden"}}><div style={{height:"100%",width:`${sc}%`,background:B.mid,borderRadius:5}}/></div></div>);})}</Card>)}
        {training.length>0&&(<Card><p style={{fontWeight:700,margin:"0 0 12px",color:B.text}}>🎓 Addestramento</p>{(()=>{const app=training.filter(t=>t.status==="appreso").length;const ic=training.filter(t=>t.status==="in corso").length;const pct=Math.round((app/COMMANDS.length)*100);return(<div><div style={{height:12,background:B.bg,borderRadius:6,overflow:"hidden",marginBottom:8}}><div style={{height:"100%",width:`${pct}%`,background:"#7C3AED",borderRadius:6}}/></div><div style={{display:"flex",gap:8}}>{[{l:"Appresi",v:app,c:"#166534",bg:"#dcfce7"},{l:"In corso",v:ic,c:"#854d0e",bg:"#fef9c3"},{l:"Da iniziare",v:COMMANDS.length-app-ic,c:"#475569",bg:"#f1f5f9"}].map(c=>(<div key={c.l} style={{flex:1,background:c.bg,borderRadius:8,padding:"6px",textAlign:"center"}}><p style={{fontSize:16,fontWeight:800,margin:0,color:c.c}}>{c.v}</p><p style={{fontSize:10,color:c.c,margin:0,fontWeight:600}}>{c.l}</p></div>))}</div></div>);})()}</Card>)}
      </div>)}

    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
